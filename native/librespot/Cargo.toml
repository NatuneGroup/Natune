[package]
name = "natune-librespot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[lib]
name = "natune_librespot"
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
librespot-core = { path = "upstream/core", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { path = "upstream/metadata", default-features = false, features = ["rustls-tls-webpki-roots"] }
log = "=0.4.29"
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "time", "sync"] }
url = "=2.5.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
