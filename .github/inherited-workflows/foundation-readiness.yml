name: Independent foundation readiness
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Readiness phase (validation reserved for the independent agent)
        type: choice
        options: [dependency, validation]
        default: dependency
        required: true
      platform:
        description: One native host per reserved serial run
        type: choice
        options: [linux, windows, macos]
        default: linux
        required: true
permissions:
  contents: read
concurrency:
  group: independent-foundation-readiness
  cancel-in-progress: false
jobs:
  dependency:
    if: inputs.phase == 'dependency'
    runs-on: ${{ fromJSON('{"linux":"blacksmith-32vcpu-ubuntu-2404","windows":"blacksmith-32vcpu-windows-2025","macos":"blacksmith-12vcpu-macos-26"}')[inputs.platform] }}
    timeout-minutes: ${{ inputs.platform == 'linux' && 12 || 5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Import compile test and native app image (Unix)
        if: runner.os != 'Windows'
        run: |
          java -version
          ./gradlew --no-daemon --console=plain :shared:desktopTest :desktopApp:createDistributable
      - name: Import compile test and native app image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          java -version
          .\gradlew.bat --no-daemon --console=plain :shared:desktopTest :desktopApp:createDistributable
  validation:
    if: inputs.phase == 'validation'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 1
    steps:
      - run: |
          echo "No validation suite installed. Independent validation is pending."
          exit 1
