name: Build and publish release artifacts

on:
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        required: true
        type: string
      tag_name:
        required: true
        type: string
      version_name:
        required: true
        type: string
      package_version:
        description: Numeric X.Y.Z version used by native installers
        required: true
        type: string
      version_code:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      publish:
        description: Publish the release and update feed; smoke runs set false
        required: false
        type: boolean
        default: true
      build_android:
        required: false
        type: boolean
        default: true
      build_desktop:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
  # Dispatch entry point for validating packaging legs on a branch without publishing.
  workflow_dispatch:
    inputs:
      channel:
        description: stable or nightly
        required: true
        type: string
        default: nightly
      tag_name:
        required: true
        type: string
        default: SMOKE-desktop
      version_name:
        required: true
        type: string
        default: smoke
      package_version:
        description: Numeric X.Y.Z version used by native installers
        required: true
        type: string
        default: "0.0.0"
      version_code:
        required: true
        type: string
        default: "1"
      commit_sha:
        description: Commit to build; defaults to the dispatched ref
        required: false
        type: string
        default: ""
      publish:
        description: Publish the release and update feed
        required: false
        type: boolean
        default: false
      build_android:
        required: false
        type: boolean
        default: false
      build_desktop:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: false

env:
  EFFECTIVE_COMMIT_SHA: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}

jobs:
  android:
    name: Android ${{ matrix.variant }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    if: inputs.build_android
    permissions:
      # Write only for the staging prerelease that carries the APK when artifact storage is full.
      contents: write
    outputs:
      signing_status: ${{ steps.sign-apk.outputs.signing_status }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - gms-mobile-arm64
          - gms-mobile-armeabi
          - gms-mobile-x86_64
          - gms-mobile-universal
          - foss-mobile-universal
          - gms-tv-universal
        # Matching an existing row adds nothing; only Stable gets the seventh, x86 APK.
        include:
          - variant: ${{ inputs.channel == 'stable' && 'gms-mobile-x86' || 'gms-mobile-arm64' }}
    env:
      VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
      IS_NIGHTLY_BUILD: ${{ inputs.channel == 'nightly' && 'true' || 'false' }}
      NIGHTLY_BUILD_HASH: ${{ inputs.channel == 'nightly' && (inputs.commit_sha || github.sha) || '' }}
      PULL_REQUEST: 'false'
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY }}
      ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET }}
      ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
      ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
      ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET }}
      ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY }}
      ARCHIVETUNE_POTOKEN_REQUEST_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_REQUEST_KEY }}
      ARCHIVETUNE_TIDAL_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN: ${{ secrets.ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN }}
      ARCHIVETUNE_LISTENER_PRESENCE_URL: ${{ secrets.ARCHIVETUNE_LISTENER_PRESENCE_URL }}
      # The Android app reads these variables under their unprefixed names
      # (docs/build-credentials.md); secrets keep their historical names.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
      SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
      POOL_CLIENT_KEY: ${{ secrets.POOL_CLIENT_KEY }}
      FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
      FEEDBACK_INGEST_KEY: ${{ secrets.FEEDBACK_INGEST_KEY }}
      START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
      # Registered public PKCE client id for the Librespot OAuth flow (repository variable, not a secret).
      ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EFFECTIVE_COMMIT_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Resolve variant and output names
        id: variant
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          IFS=- read -r DISTRIBUTION DEVICE ABI <<< "$VARIANT"
          DISTRIBUTION_NAME="${DISTRIBUTION^}"
          DEVICE_NAME="${DEVICE^}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          CHANNEL_SUFFIX=release
          if [[ "$CHANNEL" == nightly ]]; then
            CHANNEL_SUFFIX=nightly
          fi
          echo "gradle_task=assemble${DISTRIBUTION_NAME}${DEVICE_NAME}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-${CHANNEL_SUFFIX}.apk" >> "$GITHUB_OUTPUT"

      - name: Build Librespot audio for the shipping ABI
        id: librespot
        uses: ./.github/actions/build-librespot
        with:
          variant: ${{ matrix.variant }}

      - name: Assemble Android APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "${{ steps.variant.outputs.gradle_task }}" --no-daemon --max-workers=2

      - name: Verify Librespot in the shipping APK
        shell: bash
        env:
          LIBRESPOT_VARIANT: ${{ matrix.variant }}
          LIBRESPOT_AVAILABLE: ${{ steps.librespot.outputs.available }}
        run: python3 native/librespot/android-artifact.py apk "$LIBRESPOT_VARIANT" --available "$LIBRESPOT_AVAILABLE"

      - name: Stage APK
        shell: bash
        env:
          APK_NAME: ${{ steps.variant.outputs.apk_name }}
        run: |
          set -euo pipefail
          APK_ROOT=app/build/outputs/apk
          # List what the assemble step actually left behind before asserting, so a miss names its own cause.
          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::$APK_ROOT does not exist after the assemble task."
            find app/build -maxdepth 4 -type d -print 2>/dev/null | sort || true
            exit 1
          fi
          echo "APK files under $APK_ROOT:"
          find "$APK_ROOT" -type f -name '*.apk' -print | sort
          # Only .apk files count, so the listing files and metadata AGP writes beside the APK cannot inflate it.
          mapfile -t APKS < <(find "$APK_ROOT" -type f -name '*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#APKS[@]}."
            find "$APK_ROOT" -maxdepth 8 -type f -print || true
            exit 1
          fi
          mkdir -p release-assets
          cp "${APKS[0]}" "release-assets/$APK_NAME"

      - name: Sign APK when the historical keystore is configured
        id: sign-apk
        shell: bash
        env:
          APK_NAME: ${{ steps.variant.outputs.apk_name }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="release-assets/$APK_NAME"
          if [[ -z "${KEYSTORE:-}" || -z "${KEY_ALIAS:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::warning::Android signing secrets are missing or incomplete; publishing this APK unsigned."
            echo "signing_status=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ANDROID_HOME is not exported by every runner image; the SDK locations below cover the rest.
          # A configured root is authoritative: an incomplete one fails here instead of resolving to another SDK.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [[ -d "$candidate/build-tools" ]]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi
          echo "Android SDK root: ${SDK_ROOT:-<none found>}"
          # The highest version that actually carries both tools: a partially installed directory must not win.
          BUILD_TOOLS=""
          if [[ -n "$SDK_ROOT" && -d "$SDK_ROOT/build-tools" ]]; then
            echo "Installed build-tools: $(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tr '\n' ' ')"
            while IFS= read -r candidate; do
              if [[ -x "$candidate/apksigner" && -x "$candidate/zipalign" ]]; then
                BUILD_TOOLS="$candidate"
              fi
            done < <(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V)
          fi
          if [[ -z "$BUILD_TOOLS" ]]; then
            echo "::error::Android build-tools do not contain apksigner and zipalign."
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS"
          KEYSTORE_FILE="$(mktemp)"
          ALIGNED_APK="$RUNNER_TEMP/aligned-$APK_NAME"
          trap 'rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_PATH" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            "$ALIGNED_APK"
          mv "$ALIGNED_APK" "$APK_PATH"
          echo "signing_status=signed" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        # Artifact storage is metered per organization and can be exhausted independently of this
        # build; the APK is then handed over through a release, whose assets are metered separately.
        continue-on-error: true
        with:
          name: android-${{ inputs.channel }}-${{ matrix.variant }}
          path: release-assets/${{ steps.variant.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish Android APK to a staging release when artifact upload fails
        if: steps.upload-apk.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.variant.outputs.apk_name }}
          VARIANT: ${{ matrix.variant }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-android-${VARIANT}"
          echo "::warning::Workflow-artifact upload failed; handing $APK_NAME over through release $STAGING_TAG."
          # The tag carries the variant, so the parallel matrix legs never race on one release.
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title "Staging hand-off: $CHANNEL android $VARIANT (run $GITHUB_RUN_ID)" \
              --notes "Temporary release-asset hand-off for workflow run $GITHUB_RUN_ID; removed once the $CHANNEL release is published."
          fi
          gh release upload "$STAGING_TAG" "release-assets/$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber

  desktop:
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    permissions:
      # Write only for the staging prerelease that carries the installers when artifact storage is full.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            jdk_arch: x64
            runner: blacksmith-32vcpu-windows-2025
          - platform: linux
            arch: x64
            jdk_arch: x64
            appimage_arch: x86_64
            runner: blacksmith-8vcpu-ubuntu-2404
          - platform: linux
            arch: arm64
            jdk_arch: aarch64
            appimage_arch: aarch64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
    env:
      VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      DISPLAY_VERSION: ${{ inputs.version_name }}
      ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY }}
      ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET }}
      ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
      ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
      ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET }}
      ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY }}
      ARCHIVETUNE_POTOKEN_REQUEST_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_REQUEST_KEY }}
      ARCHIVETUNE_TIDAL_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN: ${{ secrets.ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET }}
      ARCHIVETUNE_JIOSAAVN_DES_KEY: ${{ secrets.ARCHIVETUNE_JIOSAAVN_DES_KEY }}
      ARCHIVETUNE_LISTENER_PRESENCE_URL: ${{ secrets.ARCHIVETUNE_LISTENER_PRESENCE_URL }}
      # The desktop host accepts ARCHIVETUNE_* env overrides; the secrets they map
      # to keep their historical unprefixed names (docs/build-credentials.md).
      ARCHIVETUNE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      ARCHIVETUNE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ARCHIVETUNE_SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
      ARCHIVETUNE_SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
      ARCHIVETUNE_POOL_CLIENT_KEY: ${{ secrets.POOL_CLIENT_KEY }}
      ARCHIVETUNE_FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
      ARCHIVETUNE_FEEDBACK_INGEST_KEY: ${{ secrets.FEEDBACK_INGEST_KEY }}
      ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_ID }}
      ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_SECRET }}
      # Desktop-only Echo protocol configuration (docs/build-credentials.md). The audio IV keeps the name the desktop reads.
      ARCHIVETUNE_SPOTIFY_DESKTOP_CLIENT_ID: ${{ secrets.ARCHIVETUNE_SPOTIFY_DESKTOP_CLIENT_ID }}
      ARCHIVETUNE_SPOTIFY_WEB_CLIENT_ID: ${{ secrets.ARCHIVETUNE_SPOTIFY_WEB_CLIENT_ID }}
      ARCHIVETUNE_SPOTIFY_AUDIO_IV: ${{ secrets.ARCHIVETUNE_SPOTIFY_AUDIO_IV }}
      # Registered public PKCE client id for the Librespot OAuth flow (repository variable, not a secret).
      ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
      # The desktop installers compile only JVM and Kotlin/Native host targets; they never need the
      # Android SDK. Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app,
      # :jiosaavn and :deobfuscator load no build script and the shared modules skip their Android
      # targets. Without this, configuring :app lets AGP auto-install the pinned ~1 GB NDK — a slow
      # dl.google.com transfer whose corrupt downloads have failed the macOS legs, and one the desktop
      # tasks never use.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      # dl.google.com flakes have terminated configuration downloads on these runners; retry with backoff.
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EFFECTIVE_COMMIT_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Prepare optional desktop Librespot JNI
        uses: ./.github/actions/build-desktop-librespot
        with:
          host: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          architecture: ${{ matrix.jdk_arch }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native build prerequisites (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev gperf

      - name: Install native build prerequisites (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg

      - name: Set up MSYS2 MinGW toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-pkgconf
            make
            tar
            curl
            gnupg
            perl
            python
            binutils
            pkgconf
            diffutils

      - name: Locate MinGW tools for the Gradle packaging steps
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "ARCHIVETUNE_MINGW_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          echo "ARCHIVETUNE_MSYS_BIN=$(cygpath -w /usr/bin)" >> "$GITHUB_ENV"

      - name: Install Rosetta 2 (macOS x64 leg)
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        shell: bash
        # softwareupdate needs root on the macOS image; it is a no-op when Rosetta 2 is already installed.
        run: |
          sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Compute native dependency cache key (Windows)
        id: native-key-win
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/native_dependency_cache.py ]]; then
            echo "::notice::Selected source commit has no native cache helper; native recipes run uncached."
            echo "key=" >> "$GITHUB_OUTPUT"
            echo "paths<<NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            echo "NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/native_dependency_cache.py key --kind desktop --platform windows --target-arch x64 \
            --optional >> "$GITHUB_OUTPUT"

      - name: Compute native dependency cache key
        id: native-key-unix
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/native_dependency_cache.py ]]; then
            echo "::notice::Selected source commit has no native cache helper; native recipes run uncached."
            echo "key=" >> "$GITHUB_OUTPUT"
            echo "paths<<NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            echo "NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/native_dependency_cache.py key --kind desktop --optional \
            --platform "${{ matrix.platform }}" --target-arch "${{ matrix.arch }}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore native dependency cache
        id: native-cache
        if: >-
          (matrix.platform == 'windows' && steps.native-key-win.outputs.key != '') ||
          (matrix.platform != 'windows' && steps.native-key-unix.outputs.key != '')
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ matrix.platform == 'windows' && steps.native-key-win.outputs.paths || steps.native-key-unix.outputs.paths }}
          key: ${{ matrix.platform == 'windows' && steps.native-key-win.outputs.key || steps.native-key-unix.outputs.key }}

      - name: Build host native dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ -f scripts/native_dependency_cache.py && ( -e desktopApp/build/native/prefix || -e desktopApp/build/native/openssl-static || -e desktopApp/build/native/.native-deps-cache.json ) ]]; then
            if python scripts/native_dependency_cache.py verify --kind desktop --platform windows \
                --target-arch x64; then
              echo "Native dependency cache verified; skipping the recipe."
              exit 0
            fi
            echo "::warning::Native dependency cache failed validation; rebuilding it."
            python scripts/native_dependency_cache.py invalidate --kind desktop --platform windows \
              --target-arch x64
          fi
          bash desktopApp/native/scripts/build-native-deps.sh
          if [[ -f scripts/native_dependency_cache.py ]]; then
            python scripts/native_dependency_cache.py manifest --kind desktop --platform windows --optional \
              --target-arch x64
          fi

      - name: Build host native dependencies
        if: matrix.platform != 'windows'
        shell: bash
        # The macOS x64 leg runs on an arm64 runner, so the whole dependency closure is built under
        # Rosetta: darwin64-x86_64-cc dylibs for the x64 JDK/jpackage chain that packages it.
        run: |
          set -euo pipefail
          PY=(python3)
          if [[ "${{ matrix.platform }}" == macos && "${{ matrix.arch }}" == x64 ]]; then
            BUILD=(arch -x86_64 bash desktopApp/native/scripts/build-native-deps.sh)
          else
            BUILD=(bash desktopApp/native/scripts/build-native-deps.sh)
          fi
          if [[ -f scripts/native_dependency_cache.py && ( -e desktopApp/build/native/prefix || -e desktopApp/build/native/openssl-static || -e desktopApp/build/native/.native-deps-cache.json ) ]]; then
            if "${PY[@]}" scripts/native_dependency_cache.py verify --kind desktop \
                --platform "${{ matrix.platform }}" --target-arch "${{ matrix.arch }}"; then
              echo "Native dependency cache verified; skipping the recipe."
              exit 0
            fi
            echo "::warning::Native dependency cache failed validation; rebuilding it."
            "${PY[@]}" scripts/native_dependency_cache.py invalidate --kind desktop \
              --platform "${{ matrix.platform }}" --target-arch "${{ matrix.arch }}"

          fi
          "${BUILD[@]}"
          if [[ -f scripts/native_dependency_cache.py ]]; then
            "${PY[@]}" scripts/native_dependency_cache.py manifest --kind desktop --optional \
              --platform "${{ matrix.platform }}" --target-arch "${{ matrix.arch }}"
          fi


      - name: Save native dependency cache
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          hashFiles('desktopApp/build/native/.native-deps-cache.json') != '' &&
          ((matrix.platform == 'windows' && steps.native-key-win.outputs.key != '') ||
           (matrix.platform != 'windows' && steps.native-key-unix.outputs.key != '')) &&
          steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ matrix.platform == 'windows' && steps.native-key-win.outputs.paths || steps.native-key-unix.outputs.paths }}
          key: ${{ matrix.platform == 'windows' && steps.native-key-win.outputs.key || steps.native-key-unix.outputs.key }}

      # The staged TDLight library is a pure function of the pinned tdlight commit, the recipe itself, the static
      # OpenSSL/zlib prefix it links against (both pins live in build-native-deps.sh) and the host. Caching under
      # exactly those inputs replaces a full TDLib compile per leg. No published native artifact carries the
      # commit it was built from, so a sibling Maven coordinate is not a substitute for this key.
      - name: Read the pinned TDLight commit
        id: tdlight-key
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n -e 's/^TDLIGHT_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' desktopApp/tdlight-jvm/native/build-tdjni.sh)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::desktopApp/tdlight-jvm/native/build-tdjni.sh no longer pins TDLIGHT_COMMIT to one 40-character commit."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Pinned TDLight commit: $commit"

      - name: Restore the TDLight native library cache
        id: tdlight-cache
        uses: actions/cache/restore@v4
        # A restore failure rebuilds TDLib; it must never fail a release leg.
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Build TDLight native library (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        # MinGW TDLib consumes the deps script's static OpenSSL prefix; the MSVC ps1 recipe is kept
        # for hosts that produce a MSVC-built static prefix, which this workflow does not create.
        run: |
          set -euo pipefail
          stage="desktopApp/build/tdlight-jvm/stage"
          library="$stage/windows-x64/native/tdjni.dll"
          notice="$stage/notices/TDLight-Boost-1.0-LICENSE.txt"
          format=""
          if [ -s "$library" ]; then
            format="$(objdump -f "$library" | sed -n -e 's/^.*file format //p' | head -n 1)"
          fi
          if [ "${{ steps.tdlight-cache.outputs.cache-hit }}" = "true" ] && [ -s "$library" ] && [ -s "$notice" ] \
              && { [ "$format" = "pe-x86-64" ] || [ "$format" = "pei-x86-64" ]; }; then
            echo "Restored a validated tdjni.dll from the pinned-commit cache; skipping the TDLib build."
            exit 0
          fi
          TDLIGHT_OPENSSL_PREFIX="$PWD/desktopApp/build/native/openssl-static" \
          TDLIGHT_ZLIB_PREFIX="$PWD/desktopApp/build/native/prefix" \
            bash desktopApp/tdlight-jvm/native/build-tdjni.sh

      - name: Build TDLight native library (Linux and macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="desktopApp/build/tdlight-jvm/stage"
          notice="$stage/notices/TDLight-Boost-1.0-LICENSE.txt"
          # The host directory and the expected machine come from the matrix, not uname: the macOS x64 leg runs
          # an arm64 host and builds its library under Rosetta.
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            linux-x64) host=linux-x64; library=libtdjni.so; expected="Advanced Micro Devices X86-64" ;;
            linux-arm64) host=linux-arm64; library=libtdjni.so; expected="AArch64" ;;
            macos-x64) host=macos-x64; library=libtdjni.dylib; expected=x86_64 ;;
            macos-arm64) host=macos-arm64; library=libtdjni.dylib; expected=arm64 ;;
            *) echo "::error::No TDLight host mapping for ${{ matrix.platform }}-${{ matrix.arch }}."; exit 1 ;;
          esac
          staged="$stage/$host/native/$library"
          architecture=""
          if [ -s "$staged" ]; then
            if [ "${{ matrix.platform }}" = "macos" ]; then
              architecture="$(lipo -archs "$staged")"
            else
              architecture="$(readelf -h "$staged" | sed -n -e 's/^ *Machine: *//p')"
            fi
          fi
          if [ "${{ steps.tdlight-cache.outputs.cache-hit }}" = "true" ] && [ -s "$staged" ] && [ -s "$notice" ] \
              && [ "$architecture" = "$expected" ]; then
            echo "Restored a validated $staged from the pinned-commit cache; skipping the TDLib build."
            exit 0
          fi
          if [[ "${{ matrix.platform }}" == macos && "${{ matrix.arch }}" == x64 ]]; then
            TDLIGHT_OPENSSL_PREFIX="$GITHUB_WORKSPACE/desktopApp/build/native/openssl-static" \
              arch -x86_64 bash desktopApp/tdlight-jvm/native/build-tdjni.sh
          else
            TDLIGHT_OPENSSL_PREFIX="$GITHUB_WORKSPACE/desktopApp/build/native/openssl-static" \
              bash desktopApp/tdlight-jvm/native/build-tdjni.sh
          fi

      - name: Save the TDLight native library cache
        # Only a trusted event in this repository may write a cache another release leg will trust.
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          steps.tdlight-key.outputs.commit != '' &&
          steps.tdlight-cache.outputs.cache-hit != 'true' &&
          hashFiles('desktopApp/build/tdlight-jvm/stage/notices/TDLight-Boost-1.0-LICENSE.txt') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Download WebView2 SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'webview2-sdk.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          Invoke-WebRequest `
            -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4258.31' `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $sdkRoot
          if (-not (Test-Path (Join-Path $sdkRoot 'build\native\include\WebView2.h'))) {
            throw "WebView2 SDK was not found under $sdkRoot"
          }
          "WEBVIEW2_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native engine before packaging (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Keep the host CMake first (the OS/browser adapters use its native generator).
          $env:PATH += ";$env:ARCHIVETUNE_MINGW_BIN;$env:ARCHIVETUNE_MSYS_BIN"
          ./gradlew.bat :desktopApp:buildNativeEngine --no-daemon --max-workers=2 `
            "-PdesktopPackageVersion=$env:PACKAGE_VERSION" `
            "-PdesktopDisplayVersion=$env:DISPLAY_VERSION"

      - name: Build native engine before packaging (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:buildNativeEngine --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Package Windows MSI and app image
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:PATH += ";$env:ARCHIVETUNE_MINGW_BIN;$env:ARCHIVETUNE_MSYS_BIN"
          ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi --no-daemon --max-workers=2 `
            "-PdesktopPackageVersion=$env:PACKAGE_VERSION" `
            "-PdesktopDisplayVersion=$env:DISPLAY_VERSION" `
            "-PdesktopWebView2Sdk=$env:WEBVIEW2_SDK"

      - name: Verify the packaged Windows native closure
        if: matrix.platform == 'windows'
        # Windows has no rpath: the engine loader preloads its sibling DLLs from native-dependencies.txt,
        # so the package fails here when an import is neither bundled nor a system library, when a DLL is
        # not x86-64, or when the manifest is missing or no longer matches the shipped import tables.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          NATIVE_DIR="desktopApp/build/compose/binaries/main/app/Natune/app/resources/native"
          if [[ ! -f "$NATIVE_DIR/archivetune_engine.dll" ]]; then
            echo "::error::$NATIVE_DIR does not hold the playback engine."
            find desktopApp/build/compose/binaries/main/app -maxdepth 3 -type d -print 2>/dev/null | sort || true
            exit 1
          fi
          python desktopApp/native/scripts/windows-native-deps.py "$NATIVE_DIR" --check

      - name: Package Linux DEB and app image
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Package macOS DMG and app image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDmg --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Stage Windows installers and portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries' -Filter '*.msi' -File -Recurse | Select-Object -First 1
          if ($null -eq $msi) { throw 'Gradle did not produce an MSI.' }
          Copy-Item $msi.FullName (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.msi")

          $appImage = Join-Path $env:GITHUB_WORKSPACE 'desktopApp/build/compose/binaries/main/app/Natune'
          if (-not (Test-Path (Join-Path $appImage 'Natune.exe'))) { throw "Desktop app image is missing: $appImage" }
          $exeDir = Join-Path $env:RUNNER_TEMP 'natune-exe'
          New-Item -ItemType Directory -Force -Path $exeDir | Out-Null
          & (Join-Path $env:JAVA_HOME 'bin/jpackage.exe') `
            --type exe `
            --app-image $appImage `
            --dest $exeDir `
            --name Natune `
            --app-version $env:PACKAGE_VERSION `
            --vendor 'Natune contributors' `
            --description 'Natune music player' `
            --icon 'desktopApp/packaging/archivetune.ico' `
            --win-per-user-install `
            --win-menu `
            --win-shortcut `
            --win-upgrade-uuid '3e762519-f005-4fcf-8201-59ef24b5528e'
          if ($LASTEXITCODE -ne 0) { throw "jpackage exited with $LASTEXITCODE" }
          $exe = Get-ChildItem $exeDir -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'jpackage did not produce an EXE installer.' }
          Copy-Item $exe.FullName (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.exe")

          Compress-Archive `
            -Path (Join-Path $appImage '*') `
            -DestinationPath (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.zip") `
            -CompressionLevel Optimal

      - name: Stage Linux DEB and AppImage
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t DEBS < <(find desktopApp/build/compose/binaries -type f -name '*.deb' | sort)
          if [[ "${#DEBS[@]}" -ne 1 ]]; then
            echo "::error::Expected one DEB package, found ${#DEBS[@]}."
            exit 1
          fi
          cp "${DEBS[0]}" "release-assets/natune-desktop-linux-${ARCH}-${DISPLAY_VERSION}.deb"

          APP_IMAGE="desktopApp/build/compose/binaries/main/app/Natune"
          if [[ ! -d "$APP_IMAGE" ]]; then
            echo "::error::Gradle did not produce the Linux app image at $APP_IMAGE."
            exit 1
          fi
          APP_DIR="$(mktemp -d "$RUNNER_TEMP/natune-appdir.XXXXXX")"
          cp -a "$APP_IMAGE/." "$APP_DIR/"
          cp desktopApp/packaging/archivetune.png "$APP_DIR/natune.png"
          cat > "$APP_DIR/natune.desktop" <<'EOF'
          [Desktop Entry]
          Name=Natune
          Exec=AppRun %u
          Icon=natune
          Type=Application
          Terminal=false
          Categories=AudioVideo;Player;
          MimeType=x-scheme-handler/archivetune;
          EOF
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/Natune" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"

          TOOL="$RUNNER_TEMP/appimagetool-${APPIMAGE_ARCH}.AppImage"
          # AppImageKit's release assets are gone; appimagetool moved to its own repository.
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            --output "$TOOL"
          chmod +x "$TOOL"
          APPIMAGE_EXTRACT_AND_RUN=1 "$TOOL" "$APP_DIR" \
            "release-assets/natune-desktop-linux-${ARCH}-${DISPLAY_VERSION}.AppImage"

      - name: Stage macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # macOS still ships Bash 3.2, which has no mapfile builtin.
          DMGS=()
          while IFS= read -r -d '' dmg; do
            DMGS+=("$dmg")
          done < <(find desktopApp/build/compose/binaries -type f -name '*.dmg' -print0)
          if [[ "${#DMGS[@]}" -ne 1 ]]; then
            echo "::error::Expected one DMG package, found ${#DMGS[@]}."
            exit 1
          fi
          cp "${DMGS[0]}" "release-assets/natune-desktop-macos-${ARCH}-${DISPLAY_VERSION}.dmg"

      - name: Upload desktop artifacts
        id: upload-desktop
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: desktop-${{ inputs.channel }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

      - name: Publish desktop installers to a staging release when artifact upload fails
        if: steps.upload-desktop.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-desktop-${PLATFORM}-${ARCH}"
          echo "::warning::Workflow-artifact upload failed; handing the $PLATFORM-$ARCH installers over through release $STAGING_TAG."
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title "Staging hand-off: $CHANNEL desktop $PLATFORM-$ARCH (run $GITHUB_RUN_ID)" \
              --notes "Temporary release-asset hand-off for workflow run $GITHUB_RUN_ID; removed once the $CHANNEL release is published."
          fi
          gh release upload "$STAGING_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  desktop-macos:
    name: Desktop macOS ${{ matrix.arch }}
    if: inputs.build_desktop
    runs-on: ${{ matrix.runner }}
    permissions:
      # Write only for the staging prerelease that carries the installers when artifact storage is full.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Optional legs: a failed or never-picked-up macOS leg must not gate the release. Both run on the
          # organization's 12 vCPU Blacksmith macOS 26 image (Apple silicon), keeping the desktop packaging
          # unchanged: the arm64 leg packages natively and the x64 leg still builds its x86_64 closure under
          # Rosetta on the same arm64 host, as before.
          # BUDGET: the same-nightly GitHub-hosted baseline was 1 h 56 m (x64) and 44 m (arm64); at
          # the provider's 40x 12 vCPU multiplier those are about 4,670 and 1,790 equivalent minutes.
          - platform: macos
            arch: x64
            jdk_arch: x64
            appimage_arch: ''
            runner: blacksmith-12vcpu-macos-26
          - platform: macos
            arch: arm64
            jdk_arch: aarch64
            appimage_arch: ''
            runner: blacksmith-12vcpu-macos-26
    env:
      ARCHIVETUNE_XCODE_VERSION: '26.4'
      VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      DISPLAY_VERSION: ${{ inputs.version_name }}
      ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY }}
      ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET }}
      ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
      ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
      ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET }}
      ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY }}
      ARCHIVETUNE_POTOKEN_REQUEST_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_REQUEST_KEY }}
      ARCHIVETUNE_TIDAL_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN: ${{ secrets.ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET }}
      ARCHIVETUNE_JIOSAAVN_DES_KEY: ${{ secrets.ARCHIVETUNE_JIOSAAVN_DES_KEY }}
      ARCHIVETUNE_LISTENER_PRESENCE_URL: ${{ secrets.ARCHIVETUNE_LISTENER_PRESENCE_URL }}
      # The desktop host accepts ARCHIVETUNE_* env overrides; the secrets they map
      # to keep their historical unprefixed names (docs/build-credentials.md).
      ARCHIVETUNE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      ARCHIVETUNE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ARCHIVETUNE_SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
      ARCHIVETUNE_SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
      ARCHIVETUNE_POOL_CLIENT_KEY: ${{ secrets.POOL_CLIENT_KEY }}
      ARCHIVETUNE_FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
      ARCHIVETUNE_FEEDBACK_INGEST_KEY: ${{ secrets.FEEDBACK_INGEST_KEY }}
      ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_ID }}
      ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_GOOGLE_DESKTOP_CLIENT_SECRET }}
      # Desktop-only Echo protocol configuration (docs/build-credentials.md). The audio IV keeps the name the desktop reads.
      ARCHIVETUNE_SPOTIFY_DESKTOP_CLIENT_ID: ${{ secrets.ARCHIVETUNE_SPOTIFY_DESKTOP_CLIENT_ID }}
      ARCHIVETUNE_SPOTIFY_WEB_CLIENT_ID: ${{ secrets.ARCHIVETUNE_SPOTIFY_WEB_CLIENT_ID }}
      ARCHIVETUNE_SPOTIFY_AUDIO_IV: ${{ secrets.ARCHIVETUNE_SPOTIFY_AUDIO_IV }}
      # Registered public PKCE client id for the Librespot OAuth flow (repository variable, not a secret).
      ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
      # The desktop installers compile only JVM and Kotlin/Native host targets; they never need the
      # Android SDK. Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app,
      # :jiosaavn and :deobfuscator load no build script and the shared modules skip their Android
      # targets. Without this, configuring :app lets AGP auto-install the pinned ~1 GB NDK — a slow
      # dl.google.com transfer whose corrupt downloads have failed the macOS legs, and one the desktop
      # tasks never use.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      # dl.google.com flakes have terminated configuration downloads on these runners; retry with backoff.
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EFFECTIVE_COMMIT_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.ARCHIVETUNE_XCODE_VERSION }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          architecture: ${{ matrix.jdk_arch }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native build prerequisites (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev gperf

      - name: Install native build prerequisites (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg

      - name: Set up MSYS2 MinGW toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-pkgconf
            make
            tar
            curl
            gnupg
            perl
            python
            binutils
            pkgconf
            diffutils

      - name: Locate MinGW tools for the Gradle packaging steps
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "ARCHIVETUNE_MINGW_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          echo "ARCHIVETUNE_MSYS_BIN=$(cygpath -w /usr/bin)" >> "$GITHUB_ENV"

      - name: Install Rosetta 2 (macOS x64 leg)
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        shell: bash
        # softwareupdate needs root on the macOS image; it is a no-op when Rosetta 2 is already installed.
        run: |
          sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build host native dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: bash desktopApp/native/scripts/build-native-deps.sh

      - name: Build host native dependencies
        if: matrix.platform != 'windows'
        shell: bash
        # The macOS x64 leg runs on an arm64 runner, so the whole dependency closure is built under
        # Rosetta: darwin64-x86_64-cc dylibs for the x64 JDK/jpackage chain that packages it.
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == macos && "${{ matrix.arch }}" == x64 ]]; then
            arch -x86_64 bash desktopApp/native/scripts/build-native-deps.sh
          else
            bash desktopApp/native/scripts/build-native-deps.sh
          fi

      # The staged TDLight library is a pure function of the pinned tdlight commit, the recipe itself, the static
      # OpenSSL/zlib prefix it links against (both pins live in build-native-deps.sh) and the host. Caching under
      # exactly those inputs replaces a full TDLib compile per leg. No published native artifact carries the
      # commit it was built from, so a sibling Maven coordinate is not a substitute for this key.
      - name: Read the pinned TDLight commit
        id: tdlight-key
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n -e 's/^TDLIGHT_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' desktopApp/tdlight-jvm/native/build-tdjni.sh)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::desktopApp/tdlight-jvm/native/build-tdjni.sh no longer pins TDLIGHT_COMMIT to one 40-character commit."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Pinned TDLight commit: $commit"

      - name: Restore the TDLight native library cache
        id: tdlight-cache
        uses: actions/cache/restore@v4
        # A restore failure rebuilds TDLib; it must never fail a release leg.
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Build TDLight native library (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        # MinGW TDLib consumes the deps script's static OpenSSL prefix; the MSVC ps1 recipe is kept
        # for hosts that produce a MSVC-built static prefix, which this workflow does not create.
        run: |
          set -euo pipefail
          stage="desktopApp/build/tdlight-jvm/stage"
          library="$stage/windows-x64/native/tdjni.dll"
          notice="$stage/notices/TDLight-Boost-1.0-LICENSE.txt"
          format=""
          if [ -s "$library" ]; then
            format="$(objdump -f "$library" | sed -n -e 's/^.*file format //p' | head -n 1)"
          fi
          if [ "${{ steps.tdlight-cache.outputs.cache-hit }}" = "true" ] && [ -s "$library" ] && [ -s "$notice" ] \
              && { [ "$format" = "pe-x86-64" ] || [ "$format" = "pei-x86-64" ]; }; then
            echo "Restored a validated tdjni.dll from the pinned-commit cache; skipping the TDLib build."
            exit 0
          fi
          TDLIGHT_OPENSSL_PREFIX="$PWD/desktopApp/build/native/openssl-static" \
          TDLIGHT_ZLIB_PREFIX="$PWD/desktopApp/build/native/prefix" \
            bash desktopApp/tdlight-jvm/native/build-tdjni.sh

      - name: Build TDLight native library (Linux and macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="desktopApp/build/tdlight-jvm/stage"
          notice="$stage/notices/TDLight-Boost-1.0-LICENSE.txt"
          # The host directory and the expected machine come from the matrix, not uname: the macOS x64 leg runs
          # an arm64 host and builds its library under Rosetta.
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            linux-x64) host=linux-x64; library=libtdjni.so; expected="Advanced Micro Devices X86-64" ;;
            linux-arm64) host=linux-arm64; library=libtdjni.so; expected="AArch64" ;;
            macos-x64) host=macos-x64; library=libtdjni.dylib; expected=x86_64 ;;
            macos-arm64) host=macos-arm64; library=libtdjni.dylib; expected=arm64 ;;
            *) echo "::error::No TDLight host mapping for ${{ matrix.platform }}-${{ matrix.arch }}."; exit 1 ;;
          esac
          staged="$stage/$host/native/$library"
          architecture=""
          if [ -s "$staged" ]; then
            if [ "${{ matrix.platform }}" = "macos" ]; then
              architecture="$(lipo -archs "$staged")"
            else
              architecture="$(readelf -h "$staged" | sed -n -e 's/^ *Machine: *//p')"
            fi
          fi
          if [ "${{ steps.tdlight-cache.outputs.cache-hit }}" = "true" ] && [ -s "$staged" ] && [ -s "$notice" ] \
              && [ "$architecture" = "$expected" ]; then
            echo "Restored a validated $staged from the pinned-commit cache; skipping the TDLib build."
            exit 0
          fi
          if [[ "${{ matrix.platform }}" == macos && "${{ matrix.arch }}" == x64 ]]; then
            TDLIGHT_OPENSSL_PREFIX="$GITHUB_WORKSPACE/desktopApp/build/native/openssl-static" \
              arch -x86_64 bash desktopApp/tdlight-jvm/native/build-tdjni.sh
          else
            TDLIGHT_OPENSSL_PREFIX="$GITHUB_WORKSPACE/desktopApp/build/native/openssl-static" \
              bash desktopApp/tdlight-jvm/native/build-tdjni.sh
          fi

      - name: Save the TDLight native library cache
        # Only a trusted event in this repository may write a cache another release leg will trust.
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          steps.tdlight-key.outputs.commit != '' &&
          steps.tdlight-cache.outputs.cache-hit != 'true' &&
          hashFiles('desktopApp/build/tdlight-jvm/stage/notices/TDLight-Boost-1.0-LICENSE.txt') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Download WebView2 SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'webview2-sdk.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          Invoke-WebRequest `
            -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4258.31' `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $sdkRoot
          if (-not (Test-Path (Join-Path $sdkRoot 'build\native\include\WebView2.h'))) {
            throw "WebView2 SDK was not found under $sdkRoot"
          }
          "WEBVIEW2_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native engine before packaging (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Keep the host CMake first (the OS/browser adapters use its native generator).
          $env:PATH += ";$env:ARCHIVETUNE_MINGW_BIN;$env:ARCHIVETUNE_MSYS_BIN"
          ./gradlew.bat :desktopApp:buildNativeEngine --no-daemon --max-workers=2 `
            "-PdesktopPackageVersion=$env:PACKAGE_VERSION" `
            "-PdesktopDisplayVersion=$env:DISPLAY_VERSION"

      - name: Build native engine before packaging (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:buildNativeEngine --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Package Windows MSI and app image
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:PATH += ";$env:ARCHIVETUNE_MINGW_BIN;$env:ARCHIVETUNE_MSYS_BIN"
          ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi --no-daemon --max-workers=2 `
            "-PdesktopPackageVersion=$env:PACKAGE_VERSION" `
            "-PdesktopDisplayVersion=$env:DISPLAY_VERSION" `
            "-PdesktopWebView2Sdk=$env:WEBVIEW2_SDK"

      - name: Package Linux DEB and app image
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Package macOS DMG and app image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDmg --no-daemon --max-workers=2 \
            "-PdesktopPackageVersion=$PACKAGE_VERSION" \
            "-PdesktopDisplayVersion=$DISPLAY_VERSION"

      - name: Stage Windows installers and portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries' -Filter '*.msi' -File -Recurse | Select-Object -First 1
          if ($null -eq $msi) { throw 'Gradle did not produce an MSI.' }
          Copy-Item $msi.FullName (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.msi")

          $appImage = Join-Path $env:GITHUB_WORKSPACE 'desktopApp/build/compose/binaries/main/app/Natune'
          if (-not (Test-Path (Join-Path $appImage 'Natune.exe'))) { throw "Desktop app image is missing: $appImage" }
          $exeDir = Join-Path $env:RUNNER_TEMP 'natune-exe'
          New-Item -ItemType Directory -Force -Path $exeDir | Out-Null
          & (Join-Path $env:JAVA_HOME 'bin/jpackage.exe') `
            --type exe `
            --app-image $appImage `
            --dest $exeDir `
            --name Natune `
            --app-version $env:PACKAGE_VERSION `
            --vendor 'Natune contributors' `
            --description 'Natune music player' `
            --icon 'desktopApp/packaging/archivetune.ico' `
            --win-per-user-install `
            --win-menu `
            --win-shortcut `
            --win-upgrade-uuid '3e762519-f005-4fcf-8201-59ef24b5528e'
          if ($LASTEXITCODE -ne 0) { throw "jpackage exited with $LASTEXITCODE" }
          $exe = Get-ChildItem $exeDir -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'jpackage did not produce an EXE installer.' }
          Copy-Item $exe.FullName (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.exe")

          Compress-Archive `
            -Path (Join-Path $appImage '*') `
            -DestinationPath (Join-Path $out "natune-desktop-windows-x64-$env:DISPLAY_VERSION.zip") `
            -CompressionLevel Optimal

      - name: Stage Linux DEB and AppImage
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t DEBS < <(find desktopApp/build/compose/binaries -type f -name '*.deb' | sort)
          if [[ "${#DEBS[@]}" -ne 1 ]]; then
            echo "::error::Expected one DEB package, found ${#DEBS[@]}."
            exit 1
          fi
          cp "${DEBS[0]}" "release-assets/natune-desktop-linux-${ARCH}-${DISPLAY_VERSION}.deb"

          APP_IMAGE="desktopApp/build/compose/binaries/main/app/Natune"
          if [[ ! -d "$APP_IMAGE" ]]; then
            echo "::error::Gradle did not produce the Linux app image at $APP_IMAGE."
            exit 1
          fi
          APP_DIR="$(mktemp -d "$RUNNER_TEMP/natune-appdir.XXXXXX")"
          cp -a "$APP_IMAGE/." "$APP_DIR/"
          cp desktopApp/packaging/archivetune.png "$APP_DIR/natune.png"
          cat > "$APP_DIR/natune.desktop" <<'EOF'
          [Desktop Entry]
          Name=Natune
          Exec=AppRun %u
          Icon=natune
          Type=Application
          Terminal=false
          Categories=AudioVideo;Player;
          MimeType=x-scheme-handler/archivetune;
          EOF
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/Natune" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"

          TOOL="$RUNNER_TEMP/appimagetool-${APPIMAGE_ARCH}.AppImage"
          # AppImageKit's release assets are gone; appimagetool moved to its own repository.
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            --output "$TOOL"
          chmod +x "$TOOL"
          APPIMAGE_EXTRACT_AND_RUN=1 "$TOOL" "$APP_DIR" \
            "release-assets/natune-desktop-linux-${ARCH}-${DISPLAY_VERSION}.AppImage"

      - name: Stage macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # macOS still ships Bash 3.2, which has no mapfile builtin.
          DMGS=()
          while IFS= read -r -d '' dmg; do
            DMGS+=("$dmg")
          done < <(find desktopApp/build/compose/binaries -type f -name '*.dmg' -print0)
          if [[ "${#DMGS[@]}" -ne 1 ]]; then
            echo "::error::Expected one DMG package, found ${#DMGS[@]}."
            exit 1
          fi
          cp "${DMGS[0]}" "release-assets/natune-desktop-macos-${ARCH}-${DISPLAY_VERSION}.dmg"

      - name: Upload desktop artifacts
        id: upload-desktop
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: desktop-${{ inputs.channel }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

      - name: Publish desktop installers to a staging release when artifact upload fails
        if: steps.upload-desktop.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-desktop-${PLATFORM}-${ARCH}"
          echo "::warning::Workflow-artifact upload failed; handing the $PLATFORM-$ARCH installers over through release $STAGING_TAG."
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title "Staging hand-off: $CHANNEL desktop $PLATFORM-$ARCH (run $GITHUB_RUN_ID)" \
              --notes "Temporary release-asset hand-off for workflow run $GITHUB_RUN_ID; removed once the $CHANNEL release is published."
          fi
          gh release upload "$STAGING_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    name: Unsigned iOS IPA
    # Blacksmith's 12 vCPU macOS 26 image is Apple silicon and follows the macOS 26 runner image.
    # setup-xcode must resolve the pinned 26.4 to /Applications/Xcode_26.4.app; that selection is
    # unverified on the Blacksmith image until a run passes.
    # BUDGET: the GitHub-hosted macos-26 baseline for this leg measured 3 h 09 m (run 41735716057);
    # at the provider's 40 equivalent minutes per 12 vCPU macOS minute, a same-duration run would
    # consume about 7,600 equivalent minutes, above the reported 3,000-equivalent-minute allowance.
    # Do not run this leg (build_ios=true) until the owner explicitly approves that spend.
    runs-on: blacksmith-12vcpu-macos-26
    if: inputs.build_ios
    permissions:
      # Write only for the staging prerelease that carries the IPA when artifact storage is full.
      contents: write
    env:
      ARCHIVETUNE_XCODE_VERSION: '26.4'
      VERSION_NAME_OVERRIDE: ${{ inputs.version_name }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
      ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY }}
      ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET }}
      ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
      ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
      ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY }}
      ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID }}
      ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET }}
      ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY }}
      ARCHIVETUNE_POTOKEN_REQUEST_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_REQUEST_KEY }}
      ARCHIVETUNE_TIDAL_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET }}
      ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN: ${{ secrets.ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID }}
      ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET }}
      ARCHIVETUNE_JIOSAAVN_DES_KEY: ${{ secrets.ARCHIVETUNE_JIOSAAVN_DES_KEY }}
      ARCHIVETUNE_LISTENER_PRESENCE_URL: ${{ secrets.ARCHIVETUNE_LISTENER_PRESENCE_URL }}
      ARCHIVETUNE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      ARCHIVETUNE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ARCHIVETUNE_SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
      ARCHIVETUNE_SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
      ARCHIVETUNE_POOL_CLIENT_KEY: ${{ secrets.POOL_CLIENT_KEY }}
      ARCHIVETUNE_FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
      ARCHIVETUNE_FEEDBACK_INGEST_KEY: ${{ secrets.FEEDBACK_INGEST_KEY }}
      # The registered public PKCE client id for the Librespot Spotify sign-in (repository variable, not a secret).
      ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
      # Google Drive backup sign-in (iOS URL scheme + OAuth client), harmless when blank.
      ARCHIVETUNE_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_GOOGLE_DRIVE_CLIENT_ID }}
      ARCHIVETUNE_GOOGLE_DRIVE_URL_SCHEME: ${{ secrets.ARCHIVETUNE_GOOGLE_DRIVE_URL_SCHEME }}
      # The job builds only the Kotlin/Native iOS framework through xcodebuild; it never needs the
      # Android SDK. Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app,
      # :jiosaavn and :deobfuscator load no build script and the shared modules skip their Android
      # targets. Without this, configuring :app lets AGP auto-install the pinned ~1 GB NDK — a slow
      # dl.google.com transfer whose corrupt downloads have failed this job, and one the iOS tasks
      # never use.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      # dl.google.com flakes have terminated configuration downloads on this runner; retry with backoff.
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EFFECTIVE_COMMIT_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.ARCHIVETUNE_XCODE_VERSION }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # The native closure verifies the FFmpeg tarball against the release key, exactly as the desktop
      # macOS legs do, so both jobs install the same gpg instead of trusting the image.
      - name: Install the FFmpeg release-key prerequisites (macOS)
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg

      - name: Compute iOS download cache key
        id: ios-downloads-key
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/native_dependency_cache.py ]]; then
            echo "::notice::Selected source commit has no native cache helper; native recipes run uncached."
            echo "key=" >> "$GITHUB_OUTPUT"
            echo "paths<<NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            echo "NATIVE_CACHE_PATHS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/native_dependency_cache.py key --kind ios-downloads --platform ios \
            --target-arch universal --optional >> "$GITHUB_OUTPUT"

      - name: Restore iOS download cache
        id: ios-downloads-cache
        if: steps.ios-downloads-key.outputs.key != ''
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ steps.ios-downloads-key.outputs.paths }}
          key: ${{ steps.ios-downloads-key.outputs.key }}

      - name: Build the iOS native dependency closure
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/native_dependency_cache.py && -e shared-data/build/ios-native-work/downloads ]]; then
            if ! python3 scripts/native_dependency_cache.py verify --kind ios-downloads --platform ios \
                --target-arch universal; then
              echo "::warning::iOS download cache failed validation; re-fetching it."
              python3 scripts/native_dependency_cache.py invalidate --kind ios-downloads --platform ios \
                --target-arch universal
            fi
          fi
          bash scripts/build_ios_native_core.sh iphoneos
          if [[ -f scripts/native_dependency_cache.py ]]; then
            python3 scripts/native_dependency_cache.py manifest --kind ios-downloads --platform ios --optional \
              --target-arch universal
          fi

      - name: Save iOS download cache
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          hashFiles('shared-data/build/ios-native-work/downloads/.cache-manifest.json') != '' &&
          steps.ios-downloads-key.outputs.key != '' &&
          steps.ios-downloads-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.ios-downloads-key.outputs.paths }}
          key: ${{ steps.ios-downloads-key.outputs.key }}

      # Native.xcconfig includes Credentials.xcconfig last, so these values reach Info.plist as build settings without
      # appearing on the xcodebuild command line. They pass through the environment and are never echoed. xcconfig
      # reads // as a comment, so each // is written as /$()/, which expands to nothing.
      - name: Write iOS provider credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          target="iosApp/Configuration/Credentials.xcconfig"
          : > "$target"
          # shellcheck disable=SC2016 # the literal $( and ${ patterns are matched and written on purpose
          write_setting() {
            local name="$1" value="${2:-}"
            if [[ "$value" == *$'\n'* || "$value" == *'$('* || "$value" == *'${'* ]]; then
              echo "::error::$name cannot be written to an xcconfig file; correct the value of its secret."
              exit 1
            fi
            printf '%s = %s\n' "$name" "$(printf '%s' "$value" | sed 's#//#/$()/#g')" >> "$target"
          }
          write_setting ARCHIVETUNE_TELEGRAM_API_ID "$ARCHIVETUNE_TELEGRAM_API_ID"
          write_setting ARCHIVETUNE_TELEGRAM_API_HASH "$ARCHIVETUNE_TELEGRAM_API_HASH"
          write_setting ARCHIVETUNE_TIDAL_CLIENT_ID "$ARCHIVETUNE_TIDAL_CLIENT_ID"
          write_setting ARCHIVETUNE_TIDAL_CLIENT_SECRET "$ARCHIVETUNE_TIDAL_CLIENT_SECRET"
          write_setting ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID "$ARCHIVETUNE_TIDAL_DEVICE_CLIENT_ID"
          write_setting ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET "$ARCHIVETUNE_TIDAL_DEVICE_CLIENT_SECRET"
          write_setting ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID "$ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID"
          write_setting ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET "$ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET"
          write_setting ARCHIVETUNE_LISTENER_PRESENCE_URL "$ARCHIVETUNE_LISTENER_PRESENCE_URL"
          write_setting ARCHIVETUNE_LASTFM_API_KEY "$ARCHIVETUNE_LASTFM_API_KEY"
          write_setting ARCHIVETUNE_LASTFM_API_SECRET "$ARCHIVETUNE_LASTFM_API_SECRET"
          write_setting ARCHIVETUNE_LYPRIO_BASE_URL "$ARCHIVETUNE_LYPRIO_BASE_URL"
          write_setting ARCHIVETUNE_ARCHIVEPOOL_BASE_URL "$ARCHIVETUNE_ARCHIVEPOOL_BASE_URL"
          write_setting ARCHIVETUNE_LYPRIO_HMAC_KEY "$ARCHIVETUNE_LYPRIO_HMAC_KEY"
          write_setting ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY "$ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY"
          write_setting ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN "$ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN"
          write_setting ARCHIVETUNE_POTOKEN_REQUEST_KEY "$ARCHIVETUNE_POTOKEN_REQUEST_KEY"
          write_setting ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY "$ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY"
          write_setting ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID "$ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID"
          # Info.plist reads these two as ArchiveTuneGoogleDriveClientId and ArchiveTuneGoogleDriveUrlScheme.
          write_setting ARCHIVETUNE_GOOGLE_DRIVE_CLIENT_ID "$ARCHIVETUNE_GOOGLE_DRIVE_CLIENT_ID"
          write_setting ARCHIVETUNE_GOOGLE_DRIVE_URL_SCHEME "$ARCHIVETUNE_GOOGLE_DRIVE_URL_SCHEME"

      - name: Build unsigned device app and create IPA
        shell: bash
        run: |
          set -euo pipefail
          # The Release framework link runs Kotlin/Native inside the Gradle JVM and exhausts the project's 4 GiB heap.
          # The user-home file outranks gradle.properties, so only this job gets the larger heap.
          mkdir -p "$HOME/.gradle"
          echo 'org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC' >> "$HOME/.gradle/gradle.properties"
          DERIVED_DATA="$RUNNER_TEMP/NatuneDerivedData"
          xcodebuild \
            -project iosApp/ArchiveTune.xcodeproj \
            -scheme ArchiveTune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            "ARCHIVETUNE_VERSION_NAME=$PACKAGE_VERSION" \
            "ARCHIVETUNE_VERSION_CODE=$VERSION_CODE_OVERRIDE" \
            "ARCHIVETUNE_TELEGRAM_API_ID=$ARCHIVETUNE_TELEGRAM_API_ID" \
            "ARCHIVETUNE_TELEGRAM_API_HASH=$ARCHIVETUNE_TELEGRAM_API_HASH" \
            "ARCHIVETUNE_LISTENER_PRESENCE_URL=$ARCHIVETUNE_LISTENER_PRESENCE_URL" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/ArchiveTune.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Xcode did not produce ArchiveTune.app at $APP_PATH."
            exit 1
          fi
          IPA_ROOT="$(mktemp -d "$RUNNER_TEMP/natune-ipa.XXXXXX")"
          mkdir -p "$IPA_ROOT/Payload" release-assets
          ditto "$APP_PATH" "$IPA_ROOT/Payload/ArchiveTune.app"
          (
            cd "$IPA_ROOT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/release-assets/natune-ios-${VERSION_NAME_OVERRIDE}.ipa" Payload
          )

      - name: Upload unsigned iOS IPA
        id: upload-ipa
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ios-${{ inputs.channel }}
          path: release-assets/natune-ios-${{ inputs.version_name }}.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Publish unsigned iOS IPA to a staging release when artifact upload fails
        if: steps.upload-ipa.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ inputs.version_name }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-ios"
          echo "::warning::Workflow-artifact upload failed; handing the iOS IPA over through release $STAGING_TAG."
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title "Staging hand-off: $CHANNEL ios (run $GITHUB_RUN_ID)" \
              --notes "Temporary release-asset hand-off for workflow run $GITHUB_RUN_ID; removed once the $CHANNEL release is published."
          fi
          gh release upload "$STAGING_TAG" "release-assets/natune-ios-${VERSION_NAME}.ipa" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish ${{ inputs.channel }} release
    # Only the required legs (Android plus the Windows/Linux desktop legs) gate this job. The macOS and
    # iOS legs are optional best-effort builds, so waiting for them would let a slow or unavailable
    # macOS leg hold the release; attach-optional-assets adds their files once the release exists.
    # !cancelled() keeps a cancelled run from publishing half-written assets.
    if: >-
      !cancelled() &&
      inputs.publish &&
      (!inputs.build_android || needs.android.result == 'success') &&
      (!inputs.build_desktop || needs.desktop.result == 'success')
    needs:
      - android
      - desktop
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    concurrency:
      group: natune-release-${{ inputs.tag_name }}
      cancel-in-progress: false
    outputs:
      did_publish: ${{ steps.publish.outputs.did_publish }}
    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EFFECTIVE_COMMIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        id: download-build-artifacts
        uses: actions/download-artifact@v8
        # A full artifact quota fails this download as well; the staging releases hold the same sets.
        continue-on-error: true
        with:
          pattern: "{android,desktop,ios}-${{ inputs.channel }}*"
          path: downloaded-artifacts
          merge-multiple: true

      - name: Restore the staging release hand-off
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_OUTCOME: ${{ steps.download-build-artifacts.outcome }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-artifacts
          # A leftover update-feed hand-off comes from an earlier attempt. This attempt regenerates the manifest,
          # so only the per-variant hand-offs are restored and the empty-list check below ignores the feed.
          mapfile -t STAGING_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/staging-${GITHUB_RUN_ID}-" \
              --jq '.[].ref' 2>/dev/null | sed 's|^refs/tags/||' | grep -v -- '-update-feed$' || true
          )
          if [[ "${#STAGING_TAGS[@]}" -eq 0 ]]; then
            if [[ "$ARTIFACTS_OUTCOME" == "success" ]]; then
              echo "Workflow artifacts are complete; run $GITHUB_RUN_ID left no staging release hand-off."
              exit 0
            fi
            echo "::error::Neither workflow artifacts nor staging release assets are available for run $GITHUB_RUN_ID."
            exit 1
          fi
          # Release assets are metered separately from artifact storage, so a leg whose artifact
          # upload hit the quota is restored from its staging release. Existing files are kept as
          # they arrived and only overwritten by an identical hand-off.
          for STAGING_TAG in "${STAGING_TAGS[@]}"; do
            case "$STAGING_TAG" in
              *-desktop-macos-*|*-ios)
                echo "Skipping optional leg hand-off $STAGING_TAG; attach-optional-assets restores it after publishing."
                continue
                ;;
            esac
            echo "Restoring release assets from $STAGING_TAG."
            if ! gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-artifacts --clobber; then
              echo "::error::Required leg '$STAGING_TAG' staging download failed."
              exit 1
            fi
          done

      - name: Create release and update-feed manifest
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ inputs.tag_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
          ANDROID_SIGNING_STATUS: ${{ needs.android.outputs.signing_status }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_DESKTOP: ${{ inputs.build_desktop }}
          BUILD_IOS: ${{ inputs.build_ios }}
        run: |
          set -euo pipefail

          # Publishing implies every required leg built. A publish with Android or the Windows/Linux
          # desktop legs disabled is rejected here — before the release exists — instead of creating
          # it and then failing the manifest on a missing inventory.
          if [[ "${BUILD_ANDROID:-true}" != "true" || "${BUILD_DESKTOP:-true}" != "true" ]]; then
            echo "::error::publish requires the Android and Windows/Linux desktop legs (build_android and build_desktop); refusing to create a release without them."
            exit 1
          fi

          TARGET_BRANCH=main
          APK_SUFFIX=release
          EXPECTED_APKS=7
          if [[ "$CHANNEL" == nightly ]]; then
            TARGET_BRANCH=dev
            APK_SUFFIX=nightly
            EXPECTED_APKS=6
          fi
          # Android APKs and the Windows/Linux installers are required: a missing one means its leg
          # failed, and that stops the release rather than shipping a broken artifact set. macOS and
          # iOS files never ship from this job, even when their legs finished first; the
          # attach-optional-assets job adds them, so the release contents do not depend on job timing.
          EXPECTED_NAMES=()
          MISSING_REQUIRED=()
          # Manifest order matters to the desktop updater, which takes the first asset matching its
          # platform and architecture: the launchable installer (exe, AppImage) precedes the others.
          DESKTOP_MANIFEST_NAMES=(
            "natune-desktop-windows-x64-${VERSION_NAME}.exe"
            "natune-desktop-windows-x64-${VERSION_NAME}.msi"
            "natune-desktop-windows-x64-${VERSION_NAME}.zip"
            "natune-desktop-linux-x64-${VERSION_NAME}.AppImage"
            "natune-desktop-linux-x64-${VERSION_NAME}.deb"
            "natune-desktop-linux-arm64-${VERSION_NAME}.AppImage"
            "natune-desktop-linux-arm64-${VERSION_NAME}.deb"
          )
          EXPECTED_NAMES+=("${DESKTOP_MANIFEST_NAMES[@]}")

          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          if [[ "$CURRENT_SHA" != "$COMMIT_SHA" ]]; then
            echo "The $TARGET_BRANCH branch advanced during the build; not publishing stale commit $COMMIT_SHA."
            echo "did_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p downloaded-artifacts
          find downloaded-artifacts -type f \( -name 'natune-desktop-macos-*' -o -name 'natune-ios-*' \) -print -delete
          mapfile -d '' RELEASE_FILES < <(find downloaded-artifacts -type f -print0 | sort -z)
          mapfile -d '' APK_FILES < <(find downloaded-artifacts -type f -name "app-*-${APK_SUFFIX}.apk" -print0 | sort -z)

          EXPECTED_TOTAL=0
          if [[ "${BUILD_ANDROID:-true}" == "true" ]]; then
            EXPECTED_TOTAL=$EXPECTED_APKS
            if [[ "${#APK_FILES[@]}" -ne "$EXPECTED_APKS" ]]; then
              echo "::error::Expected $EXPECTED_APKS $APK_SUFFIX APKs but found ${#APK_FILES[@]}; an Android leg did not deliver."
              find downloaded-artifacts -type f -print || true
              exit 1
            fi
          fi
          for NAME in "${EXPECTED_NAMES[@]}"; do
            EXPECTED_TOTAL=$((EXPECTED_TOTAL + 1))
            if [[ ! -f "downloaded-artifacts/$NAME" ]]; then
              MISSING_REQUIRED+=("$NAME")
            fi
          done

          if [[ "${#MISSING_REQUIRED[@]}" -gt 0 ]]; then
            echo "::error::Required release assets are missing because their build legs did not deliver:"
            printf '  %s\n' "${MISSING_REQUIRED[@]}"
            find downloaded-artifacts -type f -print || true
            exit 1
          fi
          if [[ "${#RELEASE_FILES[@]}" -ne "$EXPECTED_TOTAL" ]]; then
            echo "::error::Expected $EXPECTED_TOTAL release assets for the enabled legs; found ${#RELEASE_FILES[@]} files."
            find downloaded-artifacts -type f -print || true
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            if [[ "$CHANNEL" == stable ]]; then
              echo "# Natune $VERSION_NAME"
              echo
              echo "Automated stable release."
            else
              echo "# Nightly build"
              echo
              echo "Automated nightly build from the dev branch. Not intended for production use."
            fi
            echo
            echo "<!-- at-build:$VERSION_CODE -->"
            echo
            echo "## Commits"
          } > "$NOTES_FILE"

          if [[ "$CHANNEL" == stable ]]; then
            LAST_TAG="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -n "${LAST_TAG:-}" ]]; then
              git log --no-merges --pretty=format:'- %s (%h)' -n 500 "$LAST_TAG..$COMMIT_SHA" >> "$NOTES_FILE" || true
            else
              git log --no-merges --pretty=format:'- %s (%h)' -n 100 "$COMMIT_SHA" >> "$NOTES_FILE" || true
            fi
          else
            git log --no-merges --pretty=format:'- %s (%h)' -n 100 "$COMMIT_SHA" >> "$NOTES_FILE" || true
          fi
          printf '\n' >> "$NOTES_FILE"

          if [[ "$ANDROID_SIGNING_STATUS" == unsigned ]]; then
            printf '\n> Android APKs are unsigned because one or more Android signing secrets are missing.\n' >> "$NOTES_FILE"
          fi

          if [[ "${BUILD_DESKTOP:-true}" == "true" || "${BUILD_IOS:-true}" == "true" ]]; then
            printf '\n> macOS and iOS packages are optional builds; they are attached to this release when their build legs finish.\n' >> "$NOTES_FILE"
          fi

          if [[ "$CHANNEL" == stable ]]; then
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
               gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists; skipping this stable release."
              echo "did_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG_NAME" >/dev/null
            fi
            git tag -d "$TAG_NAME" >/dev/null 2>&1 || true
          fi

          RELEASE_ARGS=(
            "$TAG_NAME"
            --repo "$GITHUB_REPOSITORY"
            --target "$COMMIT_SHA"
            --title "$VERSION_NAME"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$CHANNEL" == nightly ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          fi
          gh release create "${RELEASE_ARGS[@]}" "${RELEASE_FILES[@]}"
          # Recorded as soon as the release exists, so the feed job still runs when a later step fails. The
          # stale re-check below writes false after it removes the release again.
          echo "did_publish=true" >> "$GITHUB_OUTPUT"

          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          if [[ "$CURRENT_SHA" != "$COMMIT_SHA" ]]; then
            echo "The $TARGET_BRANCH branch advanced while publishing; removing stale release $TAG_NAME."
            gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "did_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # macOS packages are attached after this manifest is written, so it lists only the required
          # desktop installers; a macOS host finds no matching asset and reports no installable update.
          MANIFEST_FILES=("${APK_FILES[@]}")
          for NAME in "${DESKTOP_MANIFEST_NAMES[@]}"; do
            MANIFEST_FILES+=("downloaded-artifacts/$NAME")
          done
          PUBLISHED_AT="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
          MANIFEST_NAME="${CHANNEL}.json"
          python3 .github/scripts/update_manifest.py \
            --channel "$CHANNEL" \
            --tag "$TAG_NAME" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --commit "$COMMIT_SHA" \
            --published-at "$PUBLISHED_AT" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME" \
            --download-url-base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --notes-file "$NOTES_FILE" \
            --output "$MANIFEST_NAME" \
            "${MANIFEST_FILES[@]}"

      - name: Upload update-feed manifest for the next job
        id: upload-update-feed
        if: steps.publish.outputs.did_publish == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: update-feed-${{ inputs.channel }}
          path: ${{ inputs.channel }}.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish update-feed manifest to a staging release when artifact upload fails
        if: steps.publish.outputs.did_publish == 'true' && steps.upload-update-feed.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: ${{ inputs.channel }}.json
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-update-feed"
          echo "::warning::Workflow-artifact upload failed; handing $MANIFEST over through release $STAGING_TAG."
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STAGING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title "Staging hand-off: $CHANNEL update-feed (run $GITHUB_RUN_ID)" \
              --notes "Temporary release-asset hand-off for workflow run $GITHUB_RUN_ID; removed once the $CHANNEL update-feed manifest is published."
          fi
          gh release upload "$STAGING_TAG" "$MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep only the newest five nightly releases
        if: steps.publish.outputs.did_publish == 'true' && inputs.channel == 'nightly'
        # Housekeeping after the release is published: a failure here must not block the feed or the release.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          KEEP=5
          # Only N<digits> tags are nightly releases, so stable v* tags, update-feed and local-* never match.
          # Drafts and releases without a publish time cannot be ordered, so they are left alone.
          NIGHTLY_RELEASES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[]
              | select(.draft == false and .published_at != null and (.tag_name | test("^N[0-9]+$")))
              | [.tag_name, .published_at] | @tsv')"
          # Newest first by publish time; the tag breaks ties. ISO 8601 UTC timestamps order correctly as text.
          mapfile -t SUPERSEDED < <(
            printf '%s\n' "$NIGHTLY_RELEASES" | sed '/^$/d' | sort -t$'\t' -k2,2r -k1,1r |
              awk -F'\t' -v keep="$KEEP" 'NR > keep { print $1 }'
          )
          for NIGHTLY_TAG in "${SUPERSEDED[@]}"; do
            if [[ "$NIGHTLY_TAG" == "$TAG_NAME" ]]; then
              continue
            fi
            if gh release delete "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "Deleted superseded nightly release $NIGHTLY_TAG."
            else
              echo "::warning::Could not delete superseded nightly release $NIGHTLY_TAG."
            fi
          done

      - name: Delete the staging release hand-off
        if: steps.publish.outputs.did_publish == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t STAGING_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/staging-${GITHUB_RUN_ID}-" \
              --jq '.[].ref' 2>/dev/null | sed 's|^refs/tags/||' || true
          )
          for STAGING_TAG in "${STAGING_TAGS[@]}"; do
            # publish-update-feed still reads the manifest from its own staging release, and
            # attach-optional-assets still reads the macOS/iOS hand-offs.
            case "$STAGING_TAG" in
              *-update-feed|*-desktop-macos-*|*-ios)
                continue
                ;;
            esac
            if gh release delete "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "Deleted staging release $STAGING_TAG."
            else
              echo "::warning::Could not delete staging release $STAGING_TAG; it stays prerelease-only."
            fi
          done

  attach-optional-assets:
    name: Attach optional macOS and iOS assets to the ${{ inputs.channel }} release
    # Runs after the release exists, so a macOS runner that never picks up delays only these files, and
    # cancelling the run leaves the published release as it is. A failed or skipped optional leg is
    # reported and listed in the release notes; it never removes or blocks the published assets.
    needs:
      - publish-release
      - desktop-macos
      - ios
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Download optional build artifacts
        id: download-optional-artifacts
        if: needs.publish-release.outputs.did_publish == 'true'
        uses: actions/download-artifact@v8
        # A full artifact quota fails this download as well; the staging releases hold the same sets.
        continue-on-error: true
        with:
          pattern: "{desktop-${{ inputs.channel }}-macos-*,ios-${{ inputs.channel }}}"
          path: optional-artifacts
          merge-multiple: true

      - name: Restore the optional staging release hand-offs
        if: needs.publish-release.outputs.did_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_OUTCOME: ${{ steps.download-optional-artifacts.outcome }}
        run: |
          set -euo pipefail
          mkdir -p optional-artifacts
          # A leg whose artifact upload failed parked its files on a staging release instead.
          mapfile -t STAGING_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/staging-${GITHUB_RUN_ID}-" \
              --jq '.[].ref' 2>/dev/null | sed 's|^refs/tags/||' | grep -E -- '-desktop-macos-|-ios$' || true
          )
          if [[ "${#STAGING_TAGS[@]}" -eq 0 ]]; then
            echo "Optional artifact download: $ARTIFACTS_OUTCOME; run $GITHUB_RUN_ID left no optional staging hand-off."
            exit 0
          fi
          for STAGING_TAG in "${STAGING_TAGS[@]}"; do
            echo "Restoring optional release assets from $STAGING_TAG."
            if ! gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --dir optional-artifacts --clobber; then
              echo "::warning::Optional leg '$STAGING_TAG' could not hand its assets over; its files stay off the release."
            fi
          done

      - name: Attach optional assets to the published release
        id: attach-optional
        if: needs.publish-release.outputs.did_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
          BUILD_DESKTOP: ${{ inputs.build_desktop }}
          BUILD_IOS: ${{ inputs.build_ios }}
          MACOS_RESULT: ${{ needs.desktop-macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          # The tag may have been re-cut by a newer run since publish-release; only this build's release takes the files.
          if ! RELEASE_DATA="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body,targetCommitish)"; then
            echo "::warning::Release $TAG_NAME no longer exists; not attaching optional assets."
            exit 0
          fi
          RELEASE_SHA="$(jq -r '.targetCommitish' <<< "$RELEASE_DATA")"
          RELEASE_BODY="$(jq -r '.body' <<< "$RELEASE_DATA")"
          if [[ "$RELEASE_SHA" != "$COMMIT_SHA" || "$RELEASE_BODY" != *"at-build:$VERSION_CODE"* ]]; then
            echo "::warning::Release $TAG_NAME targets $RELEASE_SHA, not build $VERSION_CODE of $COMMIT_SHA; not attaching optional assets."
            exit 0
          fi

          OPTIONAL_NAMES=()
          if [[ "${BUILD_DESKTOP:-true}" == "true" ]]; then
            OPTIONAL_NAMES+=(
              "natune-desktop-macos-x64-${VERSION_NAME}.dmg"
              "natune-desktop-macos-arm64-${VERSION_NAME}.dmg"
            )
          fi
          if [[ "${BUILD_IOS:-true}" == "true" ]]; then
            OPTIONAL_NAMES+=("natune-ios-${VERSION_NAME}.ipa")
          fi
          PRESENT=()
          MISSING=()
          for NAME in "${OPTIONAL_NAMES[@]}"; do
            if [[ -f "optional-artifacts/$NAME" ]]; then
              PRESENT+=("optional-artifacts/$NAME")
            else
              MISSING+=("$NAME")
            fi
          done

          if [[ "${#PRESENT[@]}" -gt 0 ]]; then
            gh release upload "$TAG_NAME" "${PRESENT[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            printf 'Attached %s\n' "${PRESENT[@]}"
          fi
          if [[ "${#MISSING[@]}" -eq 0 ]]; then
            exit 0
          fi
          for NAME in "${MISSING[@]}"; do
            echo "::warning::Optional artifact '$NAME' is absent (macOS leg: ${MACOS_RESULT:-unknown}, iOS leg: ${IOS_RESULT:-unknown}); the release ships without it."
          done
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' "$RELEASE_BODY"
            printf '\n> **Partial build:** these artifacts are missing because their macOS/iOS build legs did not complete; the rest of the release is unaffected:\n'
            for NAME in "${MISSING[@]}"; do
              printf '> - `%s`\n' "$NAME"
            done
          } > "$NOTES_FILE"
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"

      - name: Remove the optional staging release hand-offs
        # A failed attach keeps its hand-offs, so re-running this job can still find the files.
        if: always() && steps.attach-optional.outcome != 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t STAGING_TAGS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/staging-${GITHUB_RUN_ID}-" \
              --jq '.[].ref' 2>/dev/null | sed 's|^refs/tags/||' | grep -E -- '-desktop-macos-|-ios$' || true
          )
          for STAGING_TAG in "${STAGING_TAGS[@]}"; do
            if gh release delete "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "Deleted staging release $STAGING_TAG."
            else
              echo "::warning::Could not delete staging release $STAGING_TAG; it stays prerelease-only."
            fi
          done

  publish-update-feed:
    name: Publish ${{ inputs.channel }} update-feed manifest and remove staging hand-offs
    # Runs after every outcome of a publishing run, so its staging hand-offs are always removed. The manifest
    # steps below run only when publish-release created or updated the release. Smoke runs (publish: false)
    # skip this job, which keeps their hand-offs downloadable as docs/releasing.md describes.
    needs:
      - android
      - desktop
      - publish-release
    if: always() && inputs.publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    concurrency:
      group: natune-update-feed
      cancel-in-progress: false
    steps:
      - name: Download update-feed manifest
        id: download-update-feed
        if: needs.publish-release.outputs.did_publish == 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: update-feed-${{ inputs.channel }}
          path: feed-artifact

      - name: Restore the update-feed manifest from its staging release
        if: needs.publish-release.outputs.did_publish == 'true' && steps.download-update-feed.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: ${{ inputs.channel }}.json
        run: |
          set -euo pipefail
          STAGING_TAG="staging-${GITHUB_RUN_ID}-update-feed"
          if ! gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Neither the workflow artifact nor staging release $STAGING_TAG holds the $MANIFEST manifest."
            exit 1
          fi
          mkdir -p feed-artifact
          gh release download "$STAGING_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir feed-artifact \
            --pattern "$MANIFEST" \
            --clobber

      - name: Publish current manifest to the fixed update-feed release
        if: needs.publish-release.outputs.did_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ inputs.tag_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          COMMIT_SHA: ${{ env.EFFECTIVE_COMMIT_SHA }}
        run: |
          set -euo pipefail

          TARGET_BRANCH=main
          if [[ "$CHANNEL" == nightly ]]; then
            TARGET_BRANCH=dev
          fi
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          if [[ "$CURRENT_SHA" != "$COMMIT_SHA" ]]; then
            echo "The $TARGET_BRANCH branch advanced before update-feed publishing; leaving the prior manifest intact."
            exit 0
          fi

          RELEASE_DATA="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body,targetCommitish)"
          RELEASE_SHA="$(jq -r '.targetCommitish' <<< "$RELEASE_DATA")"
          RELEASE_BODY="$(jq -r '.body' <<< "$RELEASE_DATA")"
          if [[ "$RELEASE_SHA" != "$COMMIT_SHA" || "$RELEASE_BODY" != *"at-build:$VERSION_CODE"* ]]; then
            echo "Release $TAG_NAME no longer describes build $VERSION_CODE; leaving the prior manifest intact."
            exit 0
          fi

          if [[ "$CHANNEL" == stable ]]; then
            LATEST_STABLE="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | last | .tagName')"
            if [[ "$LATEST_STABLE" != "$TAG_NAME" ]]; then
              echo "A newer stable release exists; not replacing stable.json with $TAG_NAME."
              exit 0
            fi
          fi

          if ! gh release view update-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create update-feed \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --prerelease \
              --latest=false \
              --title 'Update feed (do not delete)' \
              --notes 'Holds the nightly.json and stable.json manifests used by the in-app updater.'
          fi
          gh release upload update-feed "feed-artifact/${CHANNEL}.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Remove every staging hand-off of this run
        # Last step of the run. It runs after a failed, skipped or refused publish too, and it removes the
        # update-feed hand-off that the manifest step above read.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RESULT: ${{ needs.publish-release.result }}
        run: |
          set -euo pipefail
          # The dash after the run ID keeps another run's hand-offs out of this prefix.
          if ! REFS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/staging-${GITHUB_RUN_ID}-" \
            --jq '.[].ref')"; then
            echo "::warning::Could not list the staging hand-offs of run $GITHUB_RUN_ID; delete them by hand."
            exit 0
          fi
          mapfile -t STAGING_TAGS < <(printf '%s\n' "$REFS" | sed -e 's|^refs/tags/||' -e '/^$/d')
          for STAGING_TAG in "${STAGING_TAGS[@]}"; do
            # After a successful publish, attach-optional-assets reads and then removes the macOS/iOS hand-offs.
            if [[ "$PUBLISH_RESULT" == success ]]; then
              case "$STAGING_TAG" in
                *-desktop-macos-*|*-ios)
                  continue
                  ;;
              esac
            fi
            # A tag goes only after its release is gone, so a release that survives a failed delete keeps its tag.
            if gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&
               ! gh release delete "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "::warning::Could not delete staging release $STAGING_TAG."
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$STAGING_TAG" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$STAGING_TAG" >/dev/null ||
                echo "::warning::Could not delete tag $STAGING_TAG."
            fi
          done
