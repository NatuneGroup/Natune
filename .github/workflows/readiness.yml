name: Readiness

# Manual only (Actions → Readiness → Run workflow). It compiles the shared and desktop KMP graph,
# runs the scoped shared-module tests and then checks repository contracts. It never runs on push,
# pull request or schedule, and it does not compile the Android app.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One readiness run at a time. A second dispatch waits instead of cancelling the first.
  group: readiness
  cancel-in-progress: false

jobs:
  kmp-scaffold:
    name: KMP scaffold readiness
    # Private destination only: the public NatuneGroup/ArchiveTune repository never runs this check.
    if: github.repository == 'NatuneGroup/ArchiveTune-KMP'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # This job covers the shared and desktop graph only. Empty SDK paths keep the Android targets and
      # the Android app out of the graph even on runner images that preinstall an Android SDK.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Compile shared and desktop graph
        run: >-
          ./gradlew :shared-domain:compileCommonMainKotlinMetadata :shared-data:compileCommonMainKotlinMetadata
          :shared-ui:compileCommonMainKotlinMetadata :shared-domain:compileKotlinJvm :shared-data:compileKotlinJvm
          :shared-ui:compileKotlinDesktop :desktopApp:compileKotlinJvm --max-workers=1 --no-daemon

      - name: Run shared module tests
        run: ./gradlew :shared-domain:allTests :shared-data:jvmTest :shared-ui:desktopTest --max-workers=1 --no-daemon

      - name: Check repository contracts (quarantine-aware)
        # Findings that name a parked inherited workflow stay visible and labelled. Any other finding fails.
        run: python3 scripts/check_repository.py --worktree --quarantine-aware
