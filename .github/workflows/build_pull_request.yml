name: Build Pull Request

# Recreated on blacksmith runners (previously parked under .github/inherited-workflows/).
# Gives every PR into dev/main and every dev push an assemble + lint signal plus a fast
# compile pass over the KMP shared modules, so agents get CI without local heavy builds.
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      # The Linux app image needs the same pinned native closure the release pipeline builds from source
      # (zlib 1.3.2, OpenSSL 3.5.9 static, libxml2 2.15.4, FFmpeg 8.1.3, miniaudio header) plus TDLib through
      # build-tdjni.sh. That is over an hour on an 8-vCPU runner, so it is opt-in, the same way the iOS app
      # link is: the pull-request path keeps the Kotlin compile signal only.
      #   gh workflow run build_pull_request.yml --ref <branch> -f desktop_app_image=true
      desktop_app_image:
        description: 'Build the native closure and publish the Linux desktop app image as an artifact (over an hour)'
        required: false
        type: boolean
        default: false
      quality_base:
        description: 'Quality-only manual run: full 40-character base SHA; mutually exclusive with desktop_app_image/android_release_candidate'
        required: false
        type: string
        default: ''
      # Artifact-only release candidate: one signed GMS/mobile/arm64 Release APK for storage and
      # update-over-install testing. It never publishes a release or feed, and it is not the
      # unsigned-degradable release path. Same-repository manual dispatch only, so no PR or fork
      # reaches the signing/provider secrets. It cannot be combined with desktop_app_image or
      # quality_base.
      #   gh workflow run build_pull_request.yml --ref <reviewed-branch> \
      #     -f android_release_candidate=true -f candidate_version_code=<reserved code>
      android_release_candidate:
        description: 'Build one signed ARM64 Release APK candidate artifact; requires candidate_version_code (manual dispatch only)'
        required: false
        type: boolean
        default: false
      candidate_version_code:
        description: 'Reserved absolute Android versionCode for the candidate; blank fails candidate mode'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.sha }}
  cancel-in-progress: false

env:
  DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}

jobs:
  build:
    # Public repo: fork pull requests cannot reach Blacksmith runners and must not burn the org's
    # minutes, so they run on GitHub-hosted Ubuntu instead. Same-repo PRs and dev pushes stay on
    # Blacksmith (github.event.pull_request is empty there, so the label falls through).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # A dispatch that asks for the desktop app image only wants that image; the Android assemble/lint
    # signal belongs to pull requests and dev pushes, and it would compete for the same minutes.
    # Quality-only and artifact-only candidate modes are likewise their own jobs.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.desktop_app_image != true &&
       inputs.android_release_candidate != true &&
       inputs.quality_base == '')

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Prefetch the Gradle distribution
        uses: ./.github/actions/prefetch-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Librespot audio (universal)
        id: librespot
        uses: ./.github/actions/build-librespot

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties caps daemons at 1.5 GiB for the local 8 GiB workspace; the runner
          # has more RAM, and the app module needs a bigger Kotlin daemon to compile.
          ./gradlew --console=plain --stacktrace --profile "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --warning-mode summary 2>&1 | python3 -u -c '
          import re
          import sys
          warning = re.compile(r"^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement$")
          for line in sys.stdin:
              if not warning.match(line.rstrip()):
                  sys.stdout.write(line)
          '
        env:
          ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          # Pull request builds run code that has not been reviewed yet, so no provider secret reaches
          # them; the fields resolve blank and the build still succeeds. dev pushes keep the secrets.
          # Canonical names first; the legacy secrets remain a fallback for repositories that still hold them.
          ARCHIVETUNE_LASTFM_API_KEY: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_KEY || secrets.LASTFM_API_KEY) || '' }}
          ARCHIVETUNE_LASTFM_API_SECRET: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_SECRET || secrets.LASTFM_SECRET) || '' }}
          # Built-in Lyprio server pair. Fork pull requests get no variable either.
          ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
          ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
          ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.LYPRIO_HMAC_KEY || '' }}
          # Public ArchivePool base URL. The pool's /api/sources and /api/discovery/*
          # endpoints reject unauthenticated reads with HTTP 401, so without these
          # three values baked into BuildConfig the app silently gets 0 accounts
          # and 0 discovered instances and falls back to YouTube for every track.
          # Precedence: Actions variable (preferred — non-sensitive), then secret
          # (kept for forks that stored the URL as a secret before vars existed),
          # then the gradle default (https://archivepool.vercel.app) in build.gradle.kts.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || (github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_URL || '') }}
          SOURCE_PROVIDER_KEY: ${{ github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_KEY || '' }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Compile KMP shared modules
        shell: bash
        run: |
          set -euo pipefail
          # Fast Kotlin compile over the shared tree — the shared-ui JVM target is `desktop`.
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :shared-domain:compileKotlinJvm \
            :shared-data:compileKotlinJvm \
            :shared-ui:compileKotlinDesktop

      - name: Verify Librespot in the Debug APK
        shell: bash
        env:
          LIBRESPOT_AVAILABLE: ${{ steps.librespot.outputs.available }}
        run: python3 native/librespot/android-artifact.py apk universal --available "$LIBRESPOT_AVAILABLE"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        # Organization artifact storage can be exhausted independently of this build's verdict.
        continue-on-error: true
        with:
          name: app-mobile-universal-debug-${{ github.event_name }}-${{ github.event.number || github.run_id }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
          retention-days: 7

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pr-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

  kotlin-quality:
    name: Kotlin quality
    # Structural ktfmt/Detekt/CPD checks over the Android and KMP source roots. This is an
    # independent middle-tier signal, not a compiler/LSP or native validation gate.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    if: github.event_name == 'workflow_dispatch' && inputs.quality_base != ''
    timeout-minutes: 20
    steps:
      - name: Reject incompatible manual modes
        if: github.event_name == 'workflow_dispatch'
        env:
          QUALITY_BASE_VALUE: ${{ inputs.quality_base }}
          DESKTOP_APP_IMAGE_VALUE: ${{ inputs.desktop_app_image }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          android_candidate="$(python3 -c 'import json, os; print(str(json.loads(os.environ["INPUTS_JSON"]).get("android_release_candidate", "")).lower())')"
          if [[ -n "$QUALITY_BASE_VALUE" && ( "$DESKTOP_APP_IMAGE_VALUE" == "true" || "$android_candidate" == "true" ) ]]; then
            echo "::error::quality_base is quality-only and cannot be combined with desktop_app_image or android_release_candidate."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the explicit quality base
        id: quality-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.quality_base }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BASE" ;;
            workflow_dispatch) base="$MANUAL_BASE" ;;
            *) base="" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "::error::Kotlin quality needs an explicit non-zero base commit."
            exit 1
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Kotlin quality base must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base object is not in the checkout; fetching the exact commit read-only."
            git fetch --no-tags origin "$base"
          fi
          resolved="$(git rev-parse --verify --end-of-options "${base}^{commit}")"
          if [[ "$resolved" != "$base" ]]; then
            echo "::error::Kotlin quality base did not resolve to the exact supplied commit."
            exit 1
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          if [[ "$merge_base" == "$(git rev-parse HEAD)" ]]; then
            echo "::error::Kotlin quality base resolves to the candidate HEAD."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Prefetch the Gradle distribution
        uses: ./.github/actions/prefetch-gradle

      - name: Run Kotlin formatting and structural analysis
        env:
          BASE_SHA: ${{ steps.quality-base.outputs.base }}
        run: python3 scripts/check_code_quality.py --base "$BASE_SHA"

      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-quality-reports
          path: .factory/reports/code-quality/
          if-no-files-found: ignore
          retention-days: 3

  # The desktop host compiles in its own job so a mid-flight desktopApp breakage reports
  # itself without blocking the Android assemble/lint signal.
  desktop-compile:
    # The artifact-only release candidate must run as one Android job, and a quality_base dispatch is
    # quality-only; only a default/desktop manual dispatch reaches this job.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.android_release_candidate != true &&
       inputs.quality_base == '')
    # Same fork routing as the build job: fork pull requests use the free GitHub-hosted pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # The pull-request path compiles in minutes; the opt-in app image adds the native closure build, TDLib
    # and jpackage, which measured over an hour on this runner class in the release pipeline.
    timeout-minutes: ${{ inputs.desktop_app_image && 240 || 30 }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Prefetch the Gradle distribution
        uses: ./.github/actions/prefetch-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare optional desktop Librespot JNI
        uses: ./.github/actions/build-desktop-librespot
        with:
          host: linux-x64

      - name: Compile desktop app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :desktopApp:compileKotlinJvm

      - name: Compile native PCM and JNI objects
        shell: bash
        timeout-minutes: 4
        env:
          ARCHIVETUNE_NATIVE_BUILD: ${{ runner.temp }}/natune-native-object-compile
        run: |
          set -euo pipefail
          source desktopApp/native/scripts/build-native-deps.sh
          mkdir -p "$DOWNLOADS" "$SRC" "$LOGS"
          fetch "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz" \
            "$DOWNLOADS/ffmpeg-$FFMPEG_VERSION.tar.xz" "$FFMPEG_SHA256"
          fetch "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz.asc" \
            "$DOWNLOADS/ffmpeg-$FFMPEG_VERSION.tar.xz.asc" "$FFMPEG_ASC_SHA256"
          verify_ffmpeg_signature
          unpack "$DOWNLOADS/ffmpeg-$FFMPEG_VERSION.tar.xz" "ffmpeg-$FFMPEG_VERSION"
          fetch "https://raw.githubusercontent.com/mackron/miniaudio/$MINIAUDIO_VERSION/miniaudio.h" \
            "$DOWNLOADS/miniaudio.h" "$MINIAUDIO_SHA256"
          fetch "https://raw.githubusercontent.com/mackron/miniaudio/$MINIAUDIO_VERSION/LICENSE" \
            "$DOWNLOADS/miniaudio.LICENSE" "$MINIAUDIO_LICENSE_SHA256"
          stage_miniaudio
          native_ffmpeg_source="$SRC/ffmpeg-$FFMPEG_VERSION"
          (cd "$native_ffmpeg_source" && ./configure --disable-everything --disable-programs --disable-doc --disable-x86asm \
            >"$LOGS/ffmpeg-headers.log" 2>&1) || { cat "$LOGS/ffmpeg-headers.log"; exit 1; }
          native_compile_outputs="$BUILD/pcm-objects"
          mkdir -p "$native_compile_outputs"
          for native_source in desktopApp/native/src/*.c desktopApp/native/tests/realtime_render_test.c; do
            cc -std=gnu11 -Wall -Wextra -fPIC -c "$native_source" \
              -I desktopApp/native/include -I desktopApp/native/src -I "$native_ffmpeg_source" \
              -I "$SRC/miniaudio-$MINIAUDIO_VERSION" -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
              -o "$native_compile_outputs/$(basename "$native_source" .c).o"
          done

      # The Linux app image needs the pinned native closure the release pipeline builds from source (zlib 1.3.2,
      # OpenSSL 3.5.9 static, libxml2 2.15.4, FFmpeg 8.1.3, miniaudio header) plus TDLib through build-tdjni.sh.
      # Only the release pipeline builds that closure and it measured over an hour, so it stays off the
      # pull-request path and runs on demand:
      #   gh workflow run build_pull_request.yml --ref <branch> -f desktop_app_image=true
      # It has not run yet, so it proves nothing until a run of that input passes.
      - name: Install native build prerequisites
        if: inputs.desktop_app_image == true
        shell: bash
        # The same Linux prerequisites the release desktop job installs: WebKit2GTK and GTK 3 for the
        # browser adapter, libsoup 3 for its backend and gperf for the TDLib closure.
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev gperf

      # The pinned closure is content-addressed: the recipe's own pins (zlib 1.3.2, OpenSSL 3.5.9, libxml2 2.15.4,
      # FFmpeg 8.1.3, miniaudio 0.11.25), the toolchain identity and the runner image are the key, so an exact
      # restore replaces ~6 minutes of C compilation. scripts/native_dependency_cache.py also owns the paths, so
      # the cache holds the validated prefix/openssl-static/manifest set rather than the multi-gigabyte build trees.
      - name: Compute the native dependency cache key
        if: inputs.desktop_app_image == true
        id: native-key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native_dependency_cache.py key --kind desktop --platform linux --target-arch x64 \
            --optional >> "$GITHUB_OUTPUT"

      - name: Restore the native dependency cache
        if: inputs.desktop_app_image == true && steps.native-key.outputs.key != ''
        id: native-cache
        uses: actions/cache/restore@v4
        # A cache is an accelerator, never a prerequisite: a restore failure rebuilds the closure.
        continue-on-error: true
        with:
          path: ${{ steps.native-key.outputs.paths }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Build host native dependencies
        if: inputs.desktop_app_image == true
        shell: bash
        # A restored tree is skipped only when the helper revalidates its producer inputs, file inventory,
        # SHA-256 content and ELF architecture against this checkout; anything else is rebuilt from the recipe.
        run: |
          set -euo pipefail
          if [[ -f scripts/native_dependency_cache.py && ( -e desktopApp/build/native/prefix || -e desktopApp/build/native/openssl-static || -e desktopApp/build/native/.native-deps-cache.json ) ]]; then
            if python3 scripts/native_dependency_cache.py verify --kind desktop --platform linux --target-arch x64; then
              echo "Native dependency cache verified; skipping the recipe."
              exit 0
            fi
            echo "::warning::Native dependency cache failed validation; rebuilding it."
            python3 scripts/native_dependency_cache.py invalidate --kind desktop --platform linux --target-arch x64
          fi
          bash desktopApp/native/scripts/build-native-deps.sh
          # The manifest is the identity a later run restores against, so a cold build writes it here and the
          # verification step below keeps reporting on the real prefix.
          python3 scripts/native_dependency_cache.py manifest --kind desktop --platform linux --target-arch x64

      - name: Verify the produced Linux native dependency prefix
        # One real-prefix proof after the existing producer: manifest then verify the actual
        # desktopApp/build/native prefix. It is bounded, non-blocking and never saves or rebuilds.
        # A failure/unsupported identity is reported as UNVERIFIED, even though the package job
        # stays green; success is identity/inventory/ABI evidence, not reuse, speed or runtime proof.
        if: inputs.desktop_app_image == true
        shell: bash
        timeout-minutes: 2
        continue-on-error: true
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/natune-linux-native-deps-manifest.json"
          if python3 scripts/native_dependency_cache.py manifest --kind desktop --platform linux --target-arch x64 \
              && python3 scripts/native_dependency_cache.py verify --kind desktop --platform linux --target-arch x64; then
            cp desktopApp/build/native/.native-deps-cache.json "$manifest"
            status="VERIFIED (identity, inventory and ABI only; no reuse, speed-up or runtime proof)"
          else
            status="UNVERIFIED (the real Linux prefix has no validated cache identity/inventory/ABI)"
          fi
          echo "Native cache proof: $status"
          echo "NATIVE CACHE VERIFICATION: $status" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the native dependency cache
        # Only a trusted event in this repository may write a cache another run will trust.
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          inputs.desktop_app_image == true &&
          hashFiles('desktopApp/build/native/.native-deps-cache.json') != '' &&
          steps.native-key.outputs.key != '' &&
          steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.native-key.outputs.paths }}
          key: ${{ steps.native-key.outputs.key }}

      # The TDLight stage is a pure function of four things: the pinned tdlight commit, the recipe itself, the
      # static OpenSSL/zlib prefix the recipe links against (both pins live in build-native-deps.sh), and the host.
      # build-tdjni.sh measured ~12.5 minutes on this runner class, so the compiled stage is cached under exactly
      # those inputs. The POM of a published native carries no commit hash, so a sibling artifact is not a
      # substitute for this key.
      - name: Read the pinned TDLight commit
        if: inputs.desktop_app_image == true
        id: tdlight-key
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n -e 's/^TDLIGHT_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' desktopApp/tdlight-jvm/native/build-tdjni.sh)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::desktopApp/tdlight-jvm/native/build-tdjni.sh no longer pins TDLIGHT_COMMIT to one 40-character commit."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Pinned TDLight commit: $commit"

      - name: Restore the TDLight native library cache
        if: inputs.desktop_app_image == true && steps.tdlight-key.outputs.commit != ''
        id: tdlight-cache
        uses: actions/cache/restore@v4
        # A restore failure rebuilds TDLib; it must never fail the image.
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Build TDLight native library
        if: inputs.desktop_app_image == true
        shell: bash
        # The deps script's static OpenSSL and zlib prefixes are what this TDLib recipe links against.
        run: |
          set -euo pipefail
          stage="desktopApp/build/tdlight-jvm/stage"
          library="$stage/linux-x64/native/libtdjni.so"
          notice="$stage/notices/TDLight-Boost-1.0-LICENSE.txt"
          machine=""
          if [ -s "$library" ]; then
            machine="$(readelf -h "$library" | sed -n -e 's/^ *Machine: *//p')"
          fi
          if [ "${{ steps.tdlight-cache.outputs.cache-hit }}" = "true" ] && [ -s "$library" ] && [ -s "$notice" ] \
              && [ "$machine" = "Advanced Micro Devices X86-64" ]; then
            echo "Restored a validated $library from the pinned-commit cache; skipping the TDLib build."
            exit 0
          fi
          TDLIGHT_OPENSSL_PREFIX="$PWD/desktopApp/build/native/openssl-static" \
          TDLIGHT_ZLIB_PREFIX="$PWD/desktopApp/build/native/prefix" \
            bash desktopApp/tdlight-jvm/native/build-tdjni.sh
          machine="$(readelf -h "$library" | sed -n -e 's/^ *Machine: *//p')"
          if [ "$machine" != "Advanced Micro Devices X86-64" ]; then
            echo "::error::build-tdjni.sh staged no x86_64 $library (machine: ${machine:-unreadable})"
            exit 1
          fi
          echo "Staged $library for $machine."

      - name: Save the TDLight native library cache
        if: >-
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'NatuneGroup/Natune' &&
          inputs.desktop_app_image == true &&
          steps.tdlight-key.outputs.commit != '' &&
          steps.tdlight-cache.outputs.cache-hit != 'true' &&
          hashFiles('desktopApp/build/tdlight-jvm/stage/notices/TDLight-Boost-1.0-LICENSE.txt') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: desktopApp/build/tdlight-jvm/stage
          key: tdlight-jni-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tdlight-key.outputs.commit }}-${{ hashFiles('desktopApp/tdlight-jvm/native/build-tdjni.sh', 'desktopApp/native/scripts/build-native-deps.sh') }}

      - name: Build the native engine before packaging
        if: inputs.desktop_app_image == true
        shell: bash
        # 1.0.0 is the untagged pull-request package version. The release also passes
        # -PdesktopDisplayVersion, and this mirrors it so both packaging steps agree.
        env:
          # Packaging compiles only JVM and Kotlin/Native host targets; it never needs the Android SDK.
          # Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app, :jiosaavn and
          # :deobfuscator load no build script and AGP never auto-installs the pinned ~1 GB NDK.
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          # dl.google.com flakes have terminated configuration downloads on these runners; retry with backoff.
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:buildNativeEngine --no-daemon --max-workers=2 \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0
          cmake --build desktopApp/build/native/engine-build --target archivetune_realtime_test --parallel 2
          ctest --test-dir desktopApp/build/native/engine-build --output-on-failure -R realtime-render

      - name: Run the desktop test suite against the native closure
        if: inputs.desktop_app_image == true
        shell: bash
        # DesktopPlaybackEngineTest, DesktopPlaybackPortTest and DesktopPlaybackStreamTest decode the committed
        # fixtures through the engine, so they need the closure the previous step just built and they are the
        # reason the unit-test workflow passes -PdesktopEngineTests=false. This step runs the untrimmed task, so
        # every desktop suite executes here; it stops before packaging so a test failure does not spend the
        # remaining half hour on jpackage.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:jvmTest --rerun --no-daemon --max-workers=2 \
            "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0

      - name: Upload the desktop test reports
        if: always() && inputs.desktop_app_image == true
        uses: actions/upload-artifact@v7
        # The full desktop suite only runs in this opt-in job; its JUnit XML is what names a failing engine
        # assertion precisely. Quota exposure is the same as the other report uploads, so a failed upload must
        # not mask the test verdict.
        continue-on-error: true
        with:
          name: desktop-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Package the Linux app image
        if: inputs.desktop_app_image == true
        shell: bash
        # createDistributable writes desktopApp/build/compose/binaries/main/app/<packageName>, the same tree
        # the release job packages the DEB from; the opt-in run stops at the app image.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable --no-daemon --max-workers=2 \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0

      - name: Stage the app image with its provenance
        if: inputs.desktop_app_image == true
        shell: bash
        run: |
          set -euo pipefail
          APP="desktopApp/build/compose/binaries/main/app/Natune"
          # A distributable that wrote no executable is not an app image, whatever else it produced.
          if [ ! -x "$APP/bin/Natune" ]; then
            echo "::error::createDistributable wrote no executable at $APP/bin/Natune"
            exit 1
          fi
          STAGE="$RUNNER_TEMP/natune-desktop"
          mkdir -p "$STAGE"
          cp -a "$APP" "$STAGE/Natune"
          # The recorded head is the pull-request head that was tested, not the merge commit a merge queue
          # or a push event may report.
          {
            echo "artifact: natune-desktop-linux-x64-app-image"
            echo "head_sha: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "ref: ${{ github.ref }}"
            echo "event: ${{ github.event_name }}"
            echo "workflow: ${{ github.workflow }}"
            echo "run_id: ${{ github.run_id }}"
            echo "run_attempt: ${{ github.run_attempt }}"
            echo "package_version: 1.0.0"
          } > "$STAGE/PROVENANCE.txt"
          # Provenance travels next to the folder, so a download says what produced it.
          tar -C "$STAGE" -czf "$STAGE/natune-desktop-linux-x64-app-image.tar.gz" Natune PROVENANCE.txt
          ls -l "$STAGE"

      - name: Upload the Linux desktop app image
        if: inputs.desktop_app_image == true
        uses: actions/upload-artifact@v7
        # Untagged: the tar is the delivery, and the provenance beside it names the head it came from.
        with:
          name: natune-desktop-linux-x64-app-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/natune-desktop/natune-desktop-linux-x64-app-image.tar.gz
            ${{ runner.temp }}/natune-desktop/PROVENANCE.txt
          retention-days: 7
          if-no-files-found: error

  # One signed GMS/mobile/arm64 Release APK, measured and uploaded as an artifact only. This is the
  # release-shaped exception to "missing secrets leave unsigned APKs": an unsigned or debug-key file
  # cannot prove update-over-install compatibility, so this mode fails closed instead.
  android-release-candidate:
    name: Android ARM64 release candidate
    # Only a same-repository manual dispatch of the reviewed branch reaches the signing/provider
    # secrets; pull requests, forks, pushes and default manual dispatches never enable this job.
    # The branch check itself runs in the first step so a tag/invalid dispatch fails visibly
    # instead of leaving every job skipped.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NatuneGroup/Natune' &&
      inputs.android_release_candidate == true &&
      inputs.quality_base == ''
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # One bounded reservation. 30 minutes is the approved whole-job maximum; a run that exceeds it
    # fails instead of delivering a late artifact as ready.
    timeout-minutes: 30

    steps:
      - name: Validate candidate dispatch and signing inputs
        shell: bash
        env:
          CANDIDATE: ${{ inputs.android_release_candidate }}
          REF_TYPE: ${{ github.ref_type }}
          DESKTOP_APP_IMAGE: ${{ inputs.desktop_app_image }}
          QUALITY_BASE: ${{ inputs.quality_base }}
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${CANDIDATE:-}" != "true" ]]; then
            echo "::error::android_release_candidate must be true to run the candidate job."
            exit 1
          fi
          if [[ "${REF_TYPE:-}" != "branch" ]]; then
            echo "::error::android_release_candidate must be dispatched from a reviewed branch, not a ${REF_TYPE:-unknown} ref."
            exit 1
          fi
          if [[ "${DESKTOP_APP_IMAGE:-}" == "true" || -n "${QUALITY_BASE:-}" ]]; then
            echo "::error::android_release_candidate cannot be combined with desktop_app_image or quality_base."
            exit 1
          fi
          # Blank or a low fallback (1/1500) is not a reserved version; only an absolute code above
          # every published and measured floor may reach the build.
          if [[ ! "${CANDIDATE_VERSION_CODE:-}" =~ ^[1-9][0-9]*$ || ${#CANDIDATE_VERSION_CODE} -gt 10 ]]; then
            echo "::error::candidate_version_code must be a reserved Android positive Int (at most 2147483647); blank/default is not a candidate version."
            exit 1
          fi
          if (( CANDIDATE_VERSION_CODE > 2147483647 )); then
            echo "::error::candidate_version_code is outside Android's supported positive Int range."
            exit 1
          fi
          # Presence only: values are never printed. The signing step receives them separately.
          for secret_name in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required historical signing secret $secret_name is missing or empty; refusing an unsigned candidate."
              exit 1
            fi
          done
          echo "Candidate dispatch inputs and the four historical signing secrets are present."

      - name: Check out the exact reviewed dispatch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Assert the checked-out source is the dispatched commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out '$ACTUAL_SHA', not the dispatched commit '$EXPECTED_SHA'."
            exit 1
          fi
          {
            echo "SOURCE_SHA=$ACTUAL_SHA"
            echo "DISPATCH_REF=$DISPATCH_REF"
          } >> "$GITHUB_ENV"
          printf 'source_sha=%s\ndispatch_ref=%s\n' "$ACTUAL_SHA" "$DISPATCH_REF"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Resolve Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          # ANDROID_HOME is not exported by every runner image; the SDK locations below cover the rest.
          # A configured root is authoritative: an incomplete one fails instead of resolving elsewhere.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [[ -d "$candidate/build-tools" ]]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi
          BUILD_TOOLS=""
          if [[ -n "$SDK_ROOT" && -d "$SDK_ROOT/build-tools" ]]; then
            # The highest version that actually carries every tool: a partial directory must not win.
            while IFS= read -r candidate; do
              if [[ -x "$candidate/apksigner" && -x "$candidate/zipalign" && -x "$candidate/aapt2" ]]; then
                BUILD_TOOLS="$candidate"
              fi
            done < <(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V)
          fi
          if [[ -z "$BUILD_TOOLS" ]]; then
            echo "::error::Android build-tools do not contain apksigner, zipalign and aapt2."
            exit 1
          fi
          {
            echo "BUILD_TOOLS=$BUILD_TOOLS"
            echo "BUILD_TOOLS_NAME=$(basename "$BUILD_TOOLS")"
          } >> "$GITHUB_ENV"
          echo "Using build-tools: $BUILD_TOOLS"

      - name: Validate the reserved version above source and published floors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          BASELINE_VERSION_CODE: '1793753723'
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_VERSION_CODE" =~ ^[1-9][0-9]*$ || ${#CANDIDATE_VERSION_CODE} -gt 10 ]]; then
            echo "::error::candidate_version_code is not a reserved Android positive Int."
            exit 1
          fi
          if (( CANDIDATE_VERSION_CODE > 2147483647 )); then
            echo "::error::candidate_version_code is outside Android's supported positive Int range."
            exit 1
          fi
          SOURCE_FLOOR="$(awk -F'=' '/^val trustedUpgradeVersionCodeFloor[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' app/build.gradle.kts)"
          if [[ ! "$SOURCE_FLOOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read trustedUpgradeVersionCodeFloor from app/build.gradle.kts."
            exit 1
          fi
          # Published release bodies carry the same at-build marker the update feed uses. Capture the
          # complete paginated response in a runner-temporary file (release notes can be large, and a
          # failed later page must not leave a partially parsed inventory), require the API read to
          # succeed, then validate every present declaration before selecting the maximum. The owner
          # may still hold a newer unpublished installed build; the dispatcher must confirm that
          # before reserving a code (documented pre-dispatch gate).
          RELEASE_BODIES="$(mktemp "$RUNNER_TEMP/candidate-release-bodies.XXXXXX")"
          RELEASE_MAX="$(mktemp "$RUNNER_TEMP/candidate-release-max.XXXXXX")"
          trap 'rm -f "$RELEASE_BODIES" "$RELEASE_MAX"' EXIT
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .body' > "$RELEASE_BODIES"; then
            echo "::error::The published-release API read did not complete; refusing to parse a partial inventory."
            exit 1
          fi
          if ! python3 - "$RELEASE_BODIES" "$RELEASE_MAX" <<'PY'
          import re
          import sys

          declaration = re.compile(r"^<!-- at-build:([1-9][0-9]*) -->$")
          with open(sys.argv[1], encoding="utf-8") as bodies:
              lines = bodies.read().splitlines()
          values = []
          for line in lines:
              candidate = line.strip()
              if "at-build:" not in candidate:
                  continue
              match = declaration.fullmatch(candidate)
              if match is None:
                  raise SystemExit(
                      "error: malformed at-build declaration: " + repr(candidate[:120]))
              digits = match.group(1)
              if len(digits) > 10 or int(digits) > 2147483647:
                  raise SystemExit(
                      "error: at-build declaration is outside Android's positive Int range")
              values.append(int(digits))
          if not values:
              raise SystemExit(
                  "error: no complete at-build declaration in the published release bodies")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.write(f"{max(values)}\n")
          PY
          then
            echo "::error::Published release bodies have no usable build declaration; refusing to guess the current published ARM64 floor."
            exit 1
          fi
          PUBLISHED_MAX="$(cat "$RELEASE_MAX")"
          if [[ -z "${PUBLISHED_MAX:-}" ]]; then
            echo "::error::No published at-build marker was readable; refusing to guess the current published ARM64 floor."
            exit 1
          fi
          if [[ ${#PUBLISHED_MAX} -gt 10 ]]; then
            echo "::error::The newest published at-build marker is outside Android's positive Int range; refusing to compare it."
            exit 1
          fi
          if (( CANDIDATE_VERSION_CODE <= SOURCE_FLOOR )); then
            echo "::error::candidate_version_code $CANDIDATE_VERSION_CODE is not above the source floor $SOURCE_FLOOR."
            exit 1
          fi
          if (( CANDIDATE_VERSION_CODE <= BASELINE_VERSION_CODE )); then
            echo "::error::candidate_version_code $CANDIDATE_VERSION_CODE is not above the measured baseline $BASELINE_VERSION_CODE."
            exit 1
          fi
          if (( CANDIDATE_VERSION_CODE <= PUBLISHED_MAX )); then
            echo "::error::candidate_version_code $CANDIDATE_VERSION_CODE is not above the newest published build $PUBLISHED_MAX."
            exit 1
          fi
          printf 'source_floor=%s\nbaseline_version_code=%s\nnewest_published_version_code=%s\n' \
            "$SOURCE_FLOOR" "$BASELINE_VERSION_CODE" "$PUBLISHED_MAX"

      - name: Verify the trusted public baseline before trusting its signer
        shell: bash
        env:
          BASELINE_URL: https://github.com/NatuneGroup/Natune/releases/download/N20261103/app-gms-mobile-arm64-nightly.apk
          BASELINE_SHA256: 287096e15d568c8ad6e52c8a91dd55c04b5f904ea53d15a2d595ce4e16fb94bc
          BASELINE_BYTES: '20306627'
          BASELINE_VERSION_CODE: '1793753723'
          # Public certificate SHA-256 derived read-only from that pinned APK's legacy v2/v3 signing
          # block. The local parse is not a signature verification; apksigner below verifies the pinned
          # bytes before this pin is trusted, and the signed candidate must present the same certificate.
          EXPECTED_SIGNER_SHA256: 6db8326a550861f0f96b9adcb706207d75ac4480de454fb8af95daa5d6c7f9d9
        run: |
          set -euo pipefail
          BASELINE_APK="$RUNNER_TEMP/public-baseline-arm64-nightly.apk"
          BADGING="$RUNNER_TEMP/public-baseline-badging.txt"
          CERTS="$RUNNER_TEMP/public-baseline-certs.txt"
          trap 'rm -f "$BASELINE_APK" "$BADGING" "$CERTS"' EXIT
          curl --fail --silent --show-error --location --retry 3 --output "$BASELINE_APK" "$BASELINE_URL"
          ACTUAL_BYTES="$(wc -c < "$BASELINE_APK" | tr -d '[:space:]')"
          ACTUAL_SHA256="$(sha256sum "$BASELINE_APK" | cut -d' ' -f1)"
          if [[ "$ACTUAL_BYTES" != "$BASELINE_BYTES" || "$ACTUAL_SHA256" != "$BASELINE_SHA256" ]]; then
            echo "::error::The downloaded public baseline does not match the pinned bytes and SHA-256; refusing its signer pin."
            exit 1
          fi
          "$BUILD_TOOLS/aapt2" dump badging "$BASELINE_APK" > "$BADGING"
          if ! grep -q "versionCode='$BASELINE_VERSION_CODE'" "$BADGING"; then
            echo "::error::The pinned public baseline does not report the expected versionCode."
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --print-certs "$BASELINE_APK" > "$CERTS" 2>&1; then
            echo "::error::apksigner did not verify the pinned public baseline; its signer pin is not trusted."
            exit 1
          fi
          BASELINE_SIGNER="$(sed -n -e 's/^\(V[0-9][0-9.]* Signer: \|Signer #[0-9]\+ \)\{0,1\}certificate SHA-256 digest:[[:space:]]*//p' "$CERTS" | head -n1 | tr 'A-F' 'a-f' | sed -e 's/[[:space:]:]//g')"
          if [[ "$BASELINE_SIGNER" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "::error::The verified public baseline certificate does not match the reviewed signer pin."
            exit 1
          fi
          echo "Verified the pinned public baseline bytes and its certificate SHA-256 pin."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Prefetch the Gradle distribution
        uses: ./.github/actions/prefetch-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Librespot audio (ARM64)
        id: librespot
        uses: ./.github/actions/build-librespot
        with:
          variant: arm64

      - name: Assemble only the GMS mobile ARM64 release APK
        shell: bash
        env:
          VERSION_CODE_OVERRIDE: ${{ inputs.candidate_version_code }}
          SOURCE_SHA: ${{ github.sha }}
          IS_NIGHTLY_BUILD: 'true'
          NIGHTLY_BUILD_HASH: ${{ github.sha }}
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # The same provider/client BuildConfig environment the release Android leg supplies after
          # authorization: no user-created secret is embedded here, only the existing mappings.
          ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY }}
          ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET }}
          ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
          ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
          ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
          ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_SITEKEY }}
          ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN: ${{ secrets.ARCHIVETUNE_AMAZON_TURNSTILE_ORIGIN }}
          ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_ID }}
          ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_YOUTUBE_OAUTH_CLIENT_SECRET }}
          ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_GOOGLE_API_KEY }}
          ARCHIVETUNE_POTOKEN_REQUEST_KEY: ${{ secrets.ARCHIVETUNE_POTOKEN_REQUEST_KEY }}
          ARCHIVETUNE_TIDAL_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_ID }}
          ARCHIVETUNE_TIDAL_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_CLIENT_SECRET }}
          ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_ID }}
          ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET: ${{ secrets.ARCHIVETUNE_TIDAL_PKCE_CLIENT_SECRET }}
          ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN: ${{ secrets.ARCHIVETUNE_TIDAL_CANVAS_EMBED_TOKEN }}
          ARCHIVETUNE_LISTENER_PRESENCE_URL: ${{ secrets.ARCHIVETUNE_LISTENER_PRESENCE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
          POOL_CLIENT_KEY: ${{ secrets.POOL_CLIENT_KEY }}
          FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
          FEEDBACK_INGEST_KEY: ${{ secrets.FEEDBACK_INGEST_KEY }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID: ${{ vars.ARCHIVETUNE_SPOTIFY_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          VERSION_NAME_OVERRIDE="candidate-${SOURCE_SHA:0:12}"
          export VERSION_NAME_OVERRIDE
          # Standard slim Nightly shape: no optional ONNX models/runtime, TDLib stays the
          # runtime-downloaded library, and no service, locale, ABI, minSdk or signing change.
          ./gradlew :app:assembleGmsMobileArm64Release --no-daemon --max-workers=2 \
            -Pautomix=false -PslimTdlib=true

      - name: Verify Librespot in the candidate APK
        shell: bash
        env:
          LIBRESPOT_AVAILABLE: ${{ steps.librespot.outputs.available }}
        run: python3 native/librespot/android-artifact.py apk arm64 --available "$LIBRESPOT_AVAILABLE"

      - name: Stage and validate the assembled release APK
        shell: bash
        env:
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK_ROOT=app/build/outputs/apk
          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::$APK_ROOT does not exist after the fixed assemble task."
            find app/build -maxdepth 4 -type d -print 2>/dev/null | sort || true
            exit 1
          fi
          echo "APK files under $APK_ROOT:"
          find "$APK_ROOT" -type f -name '*.apk' -print | sort
          # Only .apk files count, so listing files beside the APK cannot inflate the set.
          mapfile -t APKS < <(find "$APK_ROOT" -type f -name '*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK from :app:assembleGmsMobileArm64Release, found ${#APKS[@]}."
            find "$APK_ROOT" -maxdepth 8 -type f -print || true
            exit 1
          fi
          APK="${APKS[0]}"
          case "$APK" in
            */release/*.apk) ;;
            *) echo "::error::$APK is not a Release APK."; exit 1 ;;
          esac
          METADATA="$(dirname "$APK")/output-metadata.json"
          if [[ ! -f "$METADATA" ]]; then
            echo "::error::Missing AGP output metadata beside $APK."
            exit 1
          fi
          VERSION_NAME="candidate-${SOURCE_SHA:0:12}"
          python3 - "$METADATA" "$APK" "$CANDIDATE_VERSION_CODE" "$VERSION_NAME" <<'PY'
          import json
          import sys

          metadata_path, apk_path, version_code, version_name = sys.argv[1:5]
          with open(metadata_path, encoding="utf-8") as metadata_file:
              document = json.load(metadata_file)
          variant_name = document.get("variantName")
          variant = str(variant_name or "").lower()
          for expected in ("gms", "mobile", "arm64", "release"):
              if expected not in variant:
                  raise SystemExit(
                      f"error: variant {variant_name!r} is not the exact gmsMobileArm64Release variant")
          if variant_name != "gmsMobileArm64Release":
              raise SystemExit(
                  f"error: variant {variant_name!r} is not the exact gmsMobileArm64Release variant")
          if document.get("applicationId") != "moe.rukamori.archivetune":
              raise SystemExit(f"error: unexpected applicationId {document.get('applicationId')!r}")
          elements = document.get("elements") or []
          matches = [element for element in elements if element.get("outputFile") == apk_path.rsplit("/", 1)[-1]]
          if len(matches) != 1:
              raise SystemExit("error: the assembled APK is not the single output named by AGP metadata")
          element = matches[0]
          if str(element.get("versionCode")) != version_code or element.get("versionName") != version_name:
              raise SystemExit("error: AGP metadata does not carry the reserved version code and candidate version name")
          PY
          STAGE="$RUNNER_TEMP/natune-candidate"
          mkdir -p "$STAGE"
          CANDIDATE_APK="$STAGE/natune-android-arm64-release-candidate.apk"
          cp "$APK" "$CANDIDATE_APK"
          BADGING="$RUNNER_TEMP/candidate-badging-pre-sign.txt"
          "$BUILD_TOOLS/aapt2" dump badging "$CANDIDATE_APK" > "$BADGING"
          if ! grep -q "^package: name='moe\.rukamori\.archivetune' versionCode='$CANDIDATE_VERSION_CODE' versionName='$VERSION_NAME'" "$BADGING"; then
            echo "::error::The assembled APK package/version does not match the reserved candidate."
            exit 1
          fi
          if ! grep -Eq "^(minSdkVersion|sdkVersion):'24'$" "$BADGING"; then
            echo "::error::The assembled APK does not keep the unchanged minSdk 24."
            exit 1
          fi
          if [[ "$(grep -c "^native-code: 'arm64-v8a'$" "$BADGING")" -ne 1 ]]; then
            echo "::error::The assembled APK is not exactly the arm64-v8a native set."
            exit 1
          fi
          if grep -q "application-debuggable" "$BADGING"; then
            echo "::error::The assembled APK is debuggable; refusing to label it a release candidate."
            exit 1
          fi
          python3 - "$CANDIDATE_APK" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = apk.namelist()
          abis = sorted({name.split("/")[1] for name in names if name.startswith("lib/") and name.endswith(".so")})
          if abis != ["arm64-v8a"]:
              raise SystemExit(f"error: unexpected native ABI set {abis}")
          optional = sorted(
              name for name in names
              if name.lower().endswith(".onnx")
              or name.startswith("lib/onnxruntime")
              or "/libonnxruntime" in name
              or name.rsplit("/", 1)[-1] == "libtdjni.so"
          )
          if optional:
              raise SystemExit("error: slim candidate carries optional model/TDLib entries: " + ", ".join(optional[:5]))
          PY
          {
            echo "CANDIDATE_APK=$CANDIDATE_APK"
            echo "STAGE=$STAGE"
          } >> "$GITHUB_ENV"
          echo "Staged the single validated release APK: $(basename "$CANDIDATE_APK")"

      - name: Sign and verify the candidate APK
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: 6db8326a550861f0f96b9adcb706207d75ac4480de454fb8af95daa5d6c7f9d9
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required historical signing secret $secret_name is missing; refusing to create an unsigned candidate."
              exit 1
            fi
          done
          APK="${CANDIDATE_APK:?}"
          KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/candidate-keystore.XXXXXX")"
          ALIGNED_APK="$(mktemp "$RUNNER_TEMP/candidate-aligned.XXXXXX")"
          VERIFY_LOG="$(mktemp "$RUNNER_TEMP/candidate-verify.XXXXXX")"
          CERTS_LOG="$(mktemp "$RUNNER_TEMP/candidate-certs.XXXXXX")"
          trap 'rm -f "$KEYSTORE_FILE" "$ALIGNED_APK" "$VERIFY_LOG" "$CERTS_LOG"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            "$ALIGNED_APK"
          mv "$ALIGNED_APK" "$APK"
          if ! "$BUILD_TOOLS/apksigner" verify --verbose "$APK" > "$VERIFY_LOG" 2>&1; then
            echo "::error::apksigner did not verify the signed candidate."
            exit 1
          fi
          if ! grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' "$VERIFY_LOG"; then
            echo "::error::The candidate is not verified by APK Signature Scheme v2."
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$CERTS_LOG" 2>&1; then
            echo "::error::apksigner could not read the signed candidate's certificate."
            exit 1
          fi
          ACTUAL_SIGNER="$(sed -n -e 's/^\(V[0-9][0-9.]* Signer: \|Signer #[0-9]\+ \)\{0,1\}certificate SHA-256 digest:[[:space:]]*//p' "$CERTS_LOG" | head -n1 | tr 'A-F' 'a-f' | sed -e 's/[[:space:]:]//g')"
          if [[ "$ACTUAL_SIGNER" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "::error::The signed candidate certificate does not match the trusted historical signer pin."
            exit 1
          fi
          echo "Signed candidate verified; certificate SHA-256 matches the trusted historical pin."

      - name: Record the final signed APK metadata, checksum and size report
        shell: bash
        env:
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          SOURCE_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          SIGNER_SHA256: 6db8326a550861f0f96b9adcb706207d75ac4480de454fb8af95daa5d6c7f9d9
          BASELINE_SHA256: 287096e15d568c8ad6e52c8a91dd55c04b5f904ea53d15a2d595ce4e16fb94bc
          BASELINE_BYTES: '20306627'
          BASELINE_VERSION_CODE: '1793753723'
        run: |
          set -euo pipefail
          APK="${CANDIDATE_APK:?}"
          STAGE="${STAGE:?}"
          VERSION_NAME="candidate-${SOURCE_SHA:0:12}"
          BADGING="$RUNNER_TEMP/candidate-badging-final.txt"
          # Re-assert the final signed bytes, not only the pre-sign copy.
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > "$BADGING"
          if ! grep -q "^package: name='moe\.rukamori\.archivetune' versionCode='$CANDIDATE_VERSION_CODE' versionName='$VERSION_NAME'" "$BADGING"; then
            echo "::error::The final signed APK package/version changed during signing."
            exit 1
          fi
          if ! grep -Eq "^(minSdkVersion|sdkVersion):'24'$" "$BADGING"; then
            echo "::error::The final signed APK no longer reports minSdk 24."
            exit 1
          fi
          if [[ "$(grep -c "^native-code: 'arm64-v8a'$" "$BADGING")" -ne 1 ]]; then
            echo "::error::The final signed APK is not exactly arm64-v8a."
            exit 1
          fi
          if grep -q "application-debuggable" "$BADGING"; then
            echo "::error::The final signed APK is debuggable."
            exit 1
          fi
          python3 scripts/apk_size_report.py "$APK" --output "$STAGE/apk-size.json"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          APK_BYTES="$(wc -c < "$APK" | tr -d '[:space:]')"
          MAX_APK_BYTES=20000000
          if (( APK_BYTES >= MAX_APK_BYTES )); then
            echo "::error::Final signed APK is $APK_BYTES bytes; the release-candidate limit is under $MAX_APK_BYTES bytes."
            exit 1
          fi
          echo "Final signed APK is $APK_BYTES bytes (under $MAX_APK_BYTES)."
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$APK")" > "$STAGE/SHA256SUMS"
          JAVA_VERSION_LINE="$(java -version 2>&1 | sed -n '1p')"
          export JAVA_VERSION_LINE APK_SHA256 APK_BYTES
          python3 - "$STAGE/candidate-metadata.json" <<'PY'
          import json
          import os
          import sys

          source_sha = os.environ["SOURCE_SHA"]
          document = {
              "artifact": "natune-android-arm64-release-candidate",
              "channel": "candidate",
              "published": False,
              "workflow": "Build Pull Request",
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "source_sha": source_sha,
              "dispatch_ref": os.environ.get("DISPATCH_REF", ""),
              "gradle_task": ":app:assembleGmsMobileArm64Release",
              "variant": "gms-mobile-arm64-release",
              "build_channel": "nightly-equivalent",
              "build_flags": {"automix": False, "slimTdlib": True},
              "toolchain": {
                  "jdk": os.environ.get("JAVA_VERSION_LINE", ""),
                  "gradle_wrapper": "9.6.1",
                  "compile_sdk": 37,
                  "min_sdk": 24,
                  "ndk": "30.0.16248370",
                  "build_tools": os.environ.get("BUILD_TOOLS_NAME", ""),
              },
              "package": "moe.rukamori.archivetune",
              "abi": ["arm64-v8a"],
              "version_code": int(os.environ["CANDIDATE_VERSION_CODE"]),
              "version_name": "candidate-" + source_sha[:12],
              "signer_sha256": os.environ["SIGNER_SHA256"],
              "signer_verification": {
                  "baseline_bytes_sha256_verified": True,
                  "baseline_apksigner_verified": True,
                  "candidate_apksigner_verified": True,
              },
              "apk": {
                  "file": os.path.basename(os.environ["CANDIDATE_APK"]),
                  "bytes": int(os.environ["APK_BYTES"]),
                  "sha256": os.environ["APK_SHA256"],
              },
              "trusted_baseline": {
                  "release": "N20261103",
                  "version_code": int(os.environ["BASELINE_VERSION_CODE"]),
                  "bytes": int(os.environ["BASELINE_BYTES"]),
                  "sha256": os.environ["BASELINE_SHA256"],
                  "signer_sha256": os.environ["SIGNER_SHA256"],
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as metadata_file:
              json.dump(document, metadata_file, indent=2, sort_keys=True)
              metadata_file.write("\n")
          PY
          # Exactly one APK plus small sanitized files may leave this job; a stray baseline,
          # certificate dump or key file must fail before the artifact upload.
          REQUIRED_FILES=(
            "$APK"
            "$STAGE/SHA256SUMS"
            "$STAGE/candidate-metadata.json"
            "$STAGE/apk-size.json"
          )
          for required in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$required" ]]; then
              echo "::error::The candidate artifact set is missing $required."
              exit 1
            fi
          done
          if [[ "$(find "$STAGE" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -ne 4 ]]; then
            echo "::error::The candidate staging directory holds unexpected files; only one APK plus small metadata may upload."
            find "$STAGE" -maxdepth 1 -type f -print | sort
            exit 1
          fi
          if (( $(wc -c < "$STAGE/candidate-metadata.json") > 65536 )) ||
             (( $(wc -c < "$STAGE/apk-size.json") > 262144 )); then
            echo "::error::The candidate metadata exceeds the small sanitized hand-off budget."
            exit 1
          fi
          echo "Final signed candidate: $APK_SHA256 ($APK_BYTES bytes)"

      - name: Upload the signed candidate APK and its metadata
        uses: actions/upload-artifact@v7
        # A required upload with no fallback: artifact quota or upload failure fails this job instead
        # of publishing a release, tag, external store or update-feed manifest.
        with:
          name: natune-android-arm64-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/natune-candidate/natune-android-arm64-release-candidate.apk
            ${{ runner.temp }}/natune-candidate/SHA256SUMS
            ${{ runner.temp }}/natune-candidate/candidate-metadata.json
            ${{ runner.temp }}/natune-candidate/apk-size.json
          if-no-files-found: error
          retention-days: 3
