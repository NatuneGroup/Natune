name: Build Pull Request

# Recreated on blacksmith runners (previously parked under .github/inherited-workflows/).
# Gives every PR into dev/main and every dev push an assemble + lint signal plus a fast
# compile pass over the KMP shared modules, so agents get CI without local heavy builds.
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      # The Linux app image needs the same pinned native closure the release pipeline builds from source
      # (zlib 1.3.2, OpenSSL 3.5.9 static, libxml2 2.15.4, FFmpeg 8.1.3, miniaudio header) plus TDLib through
      # build-tdjni.sh. That is over an hour on an 8-vCPU runner, so it is opt-in, the same way the iOS app
      # link is: the pull-request path keeps the Kotlin compile signal only.
      #   gh workflow run build_pull_request.yml --ref <branch> -f desktop_app_image=true
      desktop_app_image:
        description: 'Build the native closure and publish the Linux desktop app image as an artifact (over an hour)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Public repo: fork pull requests cannot reach Blacksmith runners and must not burn the org's
    # minutes, so they run on GitHub-hosted Ubuntu instead. Same-repo PRs and dev pushes stay on
    # Blacksmith (github.event.pull_request is empty there, so the label falls through).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # A dispatch that asks for the desktop app image only wants that image; the Android assemble/lint
    # signal belongs to pull requests and dev pushes, and it would compete for the same minutes.
    if: github.event_name != 'workflow_dispatch' || inputs.desktop_app_image != true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties caps daemons at 1.5 GiB for the local 8 GiB workspace; the runner
          # has more RAM, and the app module needs a bigger Kotlin daemon to compile.
          ./gradlew --console=plain --stacktrace --profile "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --warning-mode summary 2>&1 | python3 -u -c '
          import re
          import sys
          warning = re.compile(r"^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement$")
          for line in sys.stdin:
              if not warning.match(line.rstrip()):
                  sys.stdout.write(line)
          '
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          # Pull request builds run code that has not been reviewed yet, so no provider secret reaches
          # them; the fields resolve blank and the build still succeeds. dev pushes keep the secrets.
          # Canonical names first; the legacy secrets remain a fallback for repositories that still hold them.
          ARCHIVETUNE_LASTFM_API_KEY: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_KEY || secrets.LASTFM_API_KEY) || '' }}
          ARCHIVETUNE_LASTFM_API_SECRET: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_SECRET || secrets.LASTFM_SECRET) || '' }}
          # Built-in Lyprio server pair. Fork pull requests get no variable either.
          ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
          ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
          ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.LYPRIO_HMAC_KEY || '' }}
          # Public ArchivePool base URL. The pool's /api/sources and /api/discovery/*
          # endpoints reject unauthenticated reads with HTTP 401, so without these
          # three values baked into BuildConfig the app silently gets 0 accounts
          # and 0 discovered instances and falls back to YouTube for every track.
          # Precedence: Actions variable (preferred — non-sensitive), then secret
          # (kept for forks that stored the URL as a secret before vars existed),
          # then the gradle default (https://archivepool.vercel.app) in build.gradle.kts.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || (github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_URL || '') }}
          SOURCE_PROVIDER_KEY: ${{ github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_KEY || '' }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Compile KMP shared modules
        shell: bash
        run: |
          set -euo pipefail
          # Fast Kotlin compile over the shared tree — the shared-ui JVM target is `desktop`.
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :shared-domain:compileKotlinJvm \
            :shared-data:compileKotlinJvm \
            :shared-ui:compileKotlinDesktop

      - name: Upload APK
        uses: actions/upload-artifact@v7
        # Organization artifact storage can be exhausted independently of this build's verdict.
        continue-on-error: true
        with:
          name: app-mobile-universal-debug-${{ github.event_name }}-${{ github.event.number || github.run_id }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
          retention-days: 7

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pr-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

  # The desktop host compiles in its own job so a mid-flight desktopApp breakage reports
  # itself without blocking the Android assemble/lint signal.
  desktop-compile:
    # Same fork routing as the build job: fork pull requests use the free GitHub-hosted pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # The pull-request path compiles in minutes; the opt-in app image adds the native closure build, TDLib
    # and jpackage, which measured over an hour on this runner class in the release pipeline.
    timeout-minutes: ${{ inputs.desktop_app_image && 240 || 30 }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile desktop app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :desktopApp:compileKotlinJvm

      # The Linux app image needs the pinned native closure the release pipeline builds from source (zlib 1.3.2,
      # OpenSSL 3.5.9 static, libxml2 2.15.4, FFmpeg 8.1.3, miniaudio header) plus TDLib through build-tdjni.sh.
      # Only the release pipeline builds that closure and it measured over an hour, so it stays off the
      # pull-request path and runs on demand:
      #   gh workflow run build_pull_request.yml --ref <branch> -f desktop_app_image=true
      # It has not run yet, so it proves nothing until a run of that input passes.
      - name: Install native build prerequisites
        if: inputs.desktop_app_image == true
        shell: bash
        # The same Linux prerequisites the release desktop job installs: WebKit2GTK and GTK 3 for the
        # browser adapter, libsoup 3 for its backend and gperf for the TDLib closure.
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev gperf

      - name: Build host native dependencies
        if: inputs.desktop_app_image == true
        shell: bash
        run: bash desktopApp/native/scripts/build-native-deps.sh

      - name: Build TDLight native library
        if: inputs.desktop_app_image == true
        shell: bash
        # The deps script's static OpenSSL and zlib prefixes are what this TDLib recipe links against.
        run: |
          set -euo pipefail
          TDLIGHT_OPENSSL_PREFIX="$PWD/desktopApp/build/native/openssl-static" \
          TDLIGHT_ZLIB_PREFIX="$PWD/desktopApp/build/native/prefix" \
            bash desktopApp/tdlight-jvm/native/build-tdjni.sh

      - name: Build the native engine before packaging
        if: inputs.desktop_app_image == true
        shell: bash
        # 1.0.0 is the untagged pull-request package version. The release also passes
        # -PdesktopDisplayVersion, and this mirrors it so both packaging steps agree.
        env:
          # Packaging compiles only JVM and Kotlin/Native host targets; it never needs the Android SDK.
          # Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app, :jiosaavn and
          # :deobfuscator load no build script and AGP never auto-installs the pinned ~1 GB NDK.
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          # dl.google.com flakes have terminated configuration downloads on these runners; retry with backoff.
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:buildNativeEngine --no-daemon --max-workers=2 \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0

      - name: Run the desktop test suite against the native closure
        if: inputs.desktop_app_image == true
        shell: bash
        # DesktopPlaybackEngineTest, DesktopPlaybackPortTest and DesktopPlaybackStreamTest decode the committed
        # fixtures through the engine, so they need the closure the previous step just built and they are the
        # reason the unit-test workflow passes -PdesktopEngineTests=false. This step runs the untrimmed task, so
        # every desktop suite executes here; it stops before packaging so a test failure does not spend the
        # remaining half hour on jpackage.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:jvmTest --rerun --no-daemon --max-workers=2 \
            "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0

      - name: Upload the desktop test reports
        if: always() && inputs.desktop_app_image == true
        uses: actions/upload-artifact@v7
        # The full desktop suite only runs in this opt-in job; its JUnit XML is what names a failing engine
        # assertion precisely. Quota exposure is the same as the other report uploads, so a failed upload must
        # not mask the test verdict.
        continue-on-error: true
        with:
          name: desktop-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Package the Linux app image
        if: inputs.desktop_app_image == true
        shell: bash
        # createDistributable writes desktopApp/build/compose/binaries/main/app/<packageName>, the same tree
        # the release job packages the DEB from; the opt-in run stops at the app image.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:createDistributable --no-daemon --max-workers=2 \
            -PdesktopPackageVersion=1.0.0 \
            -PdesktopDisplayVersion=1.0.0

      - name: Stage the app image with its provenance
        if: inputs.desktop_app_image == true
        shell: bash
        run: |
          set -euo pipefail
          APP="desktopApp/build/compose/binaries/main/app/Natune"
          # A distributable that wrote no executable is not an app image, whatever else it produced.
          if [ ! -x "$APP/bin/Natune" ]; then
            echo "::error::createDistributable wrote no executable at $APP/bin/Natune"
            exit 1
          fi
          STAGE="$RUNNER_TEMP/natune-desktop"
          mkdir -p "$STAGE"
          cp -a "$APP" "$STAGE/Natune"
          # The recorded head is the pull-request head that was tested, not the merge commit a merge queue
          # or a push event may report.
          {
            echo "artifact: natune-desktop-linux-x64-app-image"
            echo "head_sha: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "ref: ${{ github.ref }}"
            echo "event: ${{ github.event_name }}"
            echo "workflow: ${{ github.workflow }}"
            echo "run_id: ${{ github.run_id }}"
            echo "run_attempt: ${{ github.run_attempt }}"
            echo "package_version: 1.0.0"
          } > "$STAGE/PROVENANCE.txt"
          # Provenance travels next to the folder, so a download says what produced it.
          tar -C "$STAGE" -czf "$STAGE/natune-desktop-linux-x64-app-image.tar.gz" Natune PROVENANCE.txt
          ls -l "$STAGE"

      - name: Upload the Linux desktop app image
        if: inputs.desktop_app_image == true
        uses: actions/upload-artifact@v7
        # Untagged: the tar is the delivery, and the provenance beside it names the head it came from.
        with:
          name: natune-desktop-linux-x64-app-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/natune-desktop/natune-desktop-linux-x64-app-image.tar.gz
            ${{ runner.temp }}/natune-desktop/PROVENANCE.txt
          retention-days: 7
          if-no-files-found: error
