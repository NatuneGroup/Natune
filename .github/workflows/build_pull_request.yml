name: Build Pull Request

# Recreated on blacksmith runners (previously parked under .github/inherited-workflows/).
# Gives every PR into dev/main and every dev push an assemble + lint signal plus a fast
# compile pass over the KMP shared modules, so agents get CI without local heavy builds.
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Public repo: fork pull requests cannot reach Blacksmith runners and must not burn the org's
    # minutes, so they run on GitHub-hosted Ubuntu instead. Same-repo PRs and dev pushes stay on
    # Blacksmith (github.event.pull_request is empty there, so the label falls through).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          # gradle.properties caps daemons at 1.5 GiB for the local 8 GiB workspace; the runner
          # has more RAM, and the app module needs a bigger Kotlin daemon to compile.
          ./gradlew --console=plain --stacktrace --profile "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --warning-mode summary 2>&1 | python3 -u -c '
          import re
          import sys
          warning = re.compile(r"^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement$")
          for line in sys.stdin:
              if not warning.match(line.rstrip()):
                  sys.stdout.write(line)
          '
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          # Pull request builds run code that has not been reviewed yet, so no provider secret reaches
          # them; the fields resolve blank and the build still succeeds. dev pushes keep the secrets.
          # Canonical names first; the legacy secrets remain a fallback for repositories that still hold them.
          ARCHIVETUNE_LASTFM_API_KEY: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_KEY || secrets.LASTFM_API_KEY) || '' }}
          ARCHIVETUNE_LASTFM_API_SECRET: ${{ github.event_name != 'pull_request' && (secrets.ARCHIVETUNE_LASTFM_API_SECRET || secrets.LASTFM_SECRET) || '' }}
          # Built-in Lyprio server pair. Fork pull requests get no variable either.
          ARCHIVETUNE_LYPRIO_BASE_URL: ${{ vars.LYPRIO_BASE_URL }}
          ARCHIVETUNE_ARCHIVEPOOL_BASE_URL: ${{ vars.ARCHIVEPOOL_BASE_URL }}
          ARCHIVETUNE_LYPRIO_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.LYPRIO_HMAC_KEY || '' }}
          # Public ArchivePool base URL. The pool's /api/sources and /api/discovery/*
          # endpoints reject unauthenticated reads with HTTP 401, so without these
          # three values baked into BuildConfig the app silently gets 0 accounts
          # and 0 discovered instances and falls back to YouTube for every track.
          # Precedence: Actions variable (preferred — non-sensitive), then secret
          # (kept for forks that stored the URL as a secret before vars existed),
          # then the gradle default (https://archivepool.vercel.app) in build.gradle.kts.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || (github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_URL || '') }}
          SOURCE_PROVIDER_KEY: ${{ github.event_name != 'pull_request' && secrets.SOURCE_PROVIDER_KEY || '' }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Compile KMP shared modules
        shell: bash
        run: |
          set -euo pipefail
          # Fast Kotlin compile over the shared tree — the shared-ui JVM target is `desktop`.
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :shared-domain:compileKotlinJvm \
            :shared-data:compileKotlinJvm \
            :shared-ui:compileKotlinDesktop

      - name: Upload APK
        uses: actions/upload-artifact@v7
        # Organization artifact storage can be exhausted independently of this build's verdict.
        continue-on-error: true
        with:
          name: app-mobile-universal-debug-${{ github.event_name }}-${{ github.event.number || github.run_id }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
          retention-days: 7

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: pr-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

  # The desktop host compiles in its own job so a mid-flight desktopApp breakage reports
  # itself without blocking the Android assemble/lint signal.
  desktop-compile:
    # Same fork routing as the build job: fork pull requests use the free GitHub-hosted pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile desktop app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :desktopApp:compileKotlinJvm
