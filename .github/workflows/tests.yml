name: Unit tests

# Recreated on blacksmith runners (previously parked under .github/inherited-workflows/).
# Runs the fork contract tests on every PR into dev/main and every dev push — release
# assemblies never compile src/test, so without this the tests rot unnoticed.
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      innertube_smoke:
        description: Also run the live-network InnerTubeX smoke tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per-commit: a second push must not wait out the first, and must not cancel it.
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Compile and run unit tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Fail if this documented contract variant disappears; never test a different flavor.
          # gradle.properties caps daemons at 1.5 GiB for the local 8 GiB workspace; the runner
          # has more RAM, and the app module needs a bigger Kotlin daemon to compile.
          ./gradlew --console=plain --stacktrace --profile \
            "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            -I quality/unit-tests.init.gradle \
            :app:testGmsMobileUniversalDebugUnitTest --rerun :app:criticalPolicyCoverage
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Canonical names first; the legacy secrets remain a fallback for repositories that still hold them.
          ARCHIVETUNE_LASTFM_API_KEY: ${{ secrets.ARCHIVETUNE_LASTFM_API_KEY || secrets.LASTFM_API_KEY }}
          ARCHIVETUNE_LASTFM_API_SECRET: ${{ secrets.ARCHIVETUNE_LASTFM_API_SECRET || secrets.LASTFM_SECRET }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}

      - name: Run shared KMP module tests
        shell: bash
        # This step is the verdict: every suite below must pass, so it carries no leniency flag and
        # no task is dropped. The live-network YouTube smoke tests are the one opt-in suite
        # (JvmInnerTubeXSmokeTest), because a network outage or a YouTube rate limit cannot fail an
        # unrelated change; pass the innertube_smoke input on a manual dispatch to run them.
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace --continue \
            "-Pkotlin.daemon.jvmargs=-Xmx4g -Djava.awt.headless=true" \
            :shared-domain:jvmTest --rerun :shared-data:jvmTest --rerun :shared-ui:desktopTest --rerun
        env:
          INNERTUBE_SMOKE: ${{ inputs.innertube_smoke == true && '1' || '0' }}

      - name: Upload local test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        # Artifact storage is metered per organization and can be exhausted independently of this
        # run (observed on run 40919440710): the upload then fails with the results already in the
        # logs, so it must not turn a green test leg red. The step still reports its own failure.
        continue-on-error: true
        with:
          name: unit-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/jacoco/
            shared-*/build/reports/tests/
            shared-*/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compact machine-readable test evidence
        if: always()
        uses: actions/upload-artifact@v7
        # Same quota exposure as the step above; the JUnit XML is a convenience, not the verdict.
        continue-on-error: true
        with:
          name: unit-test-machine-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/jacoco/*.xml
            app/build/test-results/**/TEST-*.xml
            shared-*/build/test-results/**/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
