name: iOS compile

# Compiles the shared modules for the iOS simulator on the organization's 12 vCPU Blacksmith macOS 26 runner.
# Linux skips these tasks because Apple cinterop needs the Xcode toolchain, so this is the only compile signal
# for iosMain. It then links the static simulator framework and type-checks the Swift app against it on an
# Xcode 26 SDK, which the iOS 26 glass and lyric views need. Runs only when iOS-facing sources change, to keep
# those billable macOS minutes bounded.
on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'shared-ui/src/iosMain/**'
      - 'shared-data/src/iosMain/**'
      - 'shared-data/src/iosTest/**'
      - 'shared-domain/src/iosMain/**'
      - 'shared-*/src/commonMain/**'
      - 'shared-*/src/appleMain/**'
      - 'shared-*/src/nativeMain/**'
      - 'shared-*/build.gradle.kts'
      - 'shared-data/src/nativeInterop/**'
      - 'iosApp/Native/**'
      - 'iosApp/tests/**'
      - 'iosApp/ArchiveTune/**'
      - 'iosApp/ArchiveTune.xcodeproj/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios_compile.yml'
  workflow_dispatch:
    inputs:
      # The app target links a static FFmpeg/TDLib/OpenSSL closure built by scripts/build_ios_native_core.sh
      # (shared-data/build/ios-native/<platform>/lib). Only the release pipeline builds it, and its device leg
      # took 3 h 09 m on the GitHub-hosted macos-26 image (run 41735716057, job 126264425424), so the pull-request
      # path stops at the framework link and the Swift type-check. This input runs the real unsigned simulator
      # app link on demand.
      ios_simulator_app:
        description: 'Build the native closure and link the unsigned simulator app target (hours, not minutes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    # Blacksmith's 12 vCPU macOS 26 image is Apple silicon and follows the macOS 26 runner image.
    # setup-xcode must resolve 26.4 to /Applications/Xcode_26.4.app; that selection is unverified on
    # the Blacksmith image until a run passes. At the provider's 40x macOS multiplier the 45-minute
    # default ceiling below caps a trial at 1,800 equivalent minutes; the opt-in 330-minute app link
    # is a 13,200-equivalent-minute cap.
    runs-on: blacksmith-12vcpu-macos-26
    # The pull-request path finishes in minutes; only the on-demand app link carries the closure build's hours
    # (the GitHub-hosted macos-26 device baseline was 3 h 09 m and the app build follows it), so the ceiling
    # covers that whole run. The 330-minute opt-in path needs explicit budget approval; the default 45-minute
    # path is the bounded 1,800-equivalent-minute trial.
    timeout-minutes: ${{ inputs.ios_simulator_app && 330 || 45 }}
    env:
      # The job compiles only Kotlin/Native iOS targets; it never needs the Android SDK.
      # Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app,
      # :jiosaavn and :morideobfuscator load no build script and the shared modules skip
      # their Android targets. Without this, configuring :app makes AGP auto-install the
      # pinned ~1 GB NDK on every run — a slow dl.google.com transfer whose corrupt
      # downloads have failed this job, and one the iOS tasks never use.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      # The Liquid Glass and TextRenderer APIs exist only in the iOS 26 SDK. The native closure pins 26.4
      # and setup-xcode resolves exactly that release (26.4 -> /Applications/Xcode_26.4.app) — a newer
      # 26.x is never substituted, matching the release pipeline's macOS jobs. The Blacksmith image has
      # not been checked for that Xcode yet; the first approved run verifies the selection.
      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Check iOS audio source contracts and PCM conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s iosApp/tests -p 'test_*.py'
          xcrun clang -std=c11 -Wall -Wextra -Werror -IiosApp/Native \
            iosApp/tests/audio_format_test.c -o "$RUNNER_TEMP/audio-format-test"
          "$RUNNER_TEMP/audio-format-test"

      # Kotlin cinterop parses only headers; the former job never compiled the crashing .mm implementation.
      # Syntax-check both real bridges against the simulator SDK without building/downloading the native closure.
      - name: Compile native audio bridges and test exception containment
        shell: bash
        run: |
          set -euo pipefail
          for source in iosApp/Native/ATNativeAudio.mm iosApp/Native/ATAudioGraph.mm; do
            xcrun --sdk iphonesimulator clang++ -std=c++17 -fobjc-arc -fobjc-exceptions \
              -fsyntax-only -Wall -Wextra -Werror=return-type \
              -target arm64-apple-ios16.0-simulator -IiosApp/Native -IdesktopApp/native/include "$source"
          done
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -fobjc-exceptions -Wall -Wextra -Werror \
            -IiosApp/Native iosApp/tests/audio_exception_test.mm -framework Foundation \
            -o "$RUNNER_TEMP/audio-exception-test"
          "$RUNNER_TEMP/audio-exception-test"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile shared modules and iosTest sources for the iOS simulator
        # Test-source compilation only: this does not link a test binary, execute tests, build the native
        # closure, run the simulator app or create an IPA.
        run: >-
          ./gradlew :shared-ui:compileKotlinIosSimulatorArm64
          :shared-data:compileTestKotlinIosSimulatorArm64 --continue --stacktrace

      # A static framework needs no native closure, so the Swift sources can be checked without the full app link.
      - name: Link the simulator framework
        run: ./gradlew :shared-ui:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Type-check the Swift app against the framework
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORKS="shared-ui/build/bin/iosSimulatorArm64/debugFramework"
          test -d "$FRAMEWORKS/ArchiveTuneShared.framework"
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -swift-version 5 \
            -target arm64-apple-ios16.0-simulator \
            -F "$FRAMEWORKS" \
            iosApp/ArchiveTune/*.swift

      # Nothing above links the app target: the two Swift host files are only type-checked and the three ObjC++
      # bridges only syntax-checked. That link needs the static FFmpeg/TDLib/OpenSSL closure from
      # scripts/build_ios_native_core.sh, because Native.xcconfig links shared-data/build/ios-native/$(PLATFORM_NAME)/lib
      # and a missing -l archive stops the linker. Only the release pipeline builds the closure (its device leg
      # measured 3 h 09 m on the GitHub-hosted macos-26 image, run 41735716057 job 126264425424), and an
      # actions/cache entry written by one pull request is not readable from another, so putting it on the default
      # trigger would charge those hours to every pull request against a 12 vCPU macOS runner. The default trigger
      # therefore keeps the framework link and the type-check, and this input adds the complete unsigned simulator
      # build on demand:
      #   gh workflow run ios_compile.yml --ref <branch> -f ios_simulator_app=true
      # It has not run yet, so it proves nothing until a run of that input passes.
      - name: Install the FFmpeg release-key prerequisite (macOS)
        if: inputs.ios_simulator_app == true
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg

      - name: Build the native dependency closure for the simulator
        if: inputs.ios_simulator_app == true
        shell: bash
        run: bash scripts/build_ios_native_core.sh iphonesimulator

      # The target's own shell phase runs the same :shared-ui:embedAndSignAppleFrameworkForXcode task that the
      # framework-link step above already satisfies, so Gradle reuses that linked output instead of recompiling it.
      # A simulator bundle needs no signing identity, which is why this disables code signing rather than supplying
      # one; the flags otherwise mirror the release pipeline's own xcodebuild of this scheme.
      - name: Link the unsigned simulator app target
        if: inputs.ios_simulator_app == true
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/NatuneSimulatorDerivedData"
          xcodebuild \
            -project iosApp/ArchiveTune.xcodeproj \
            -scheme ArchiveTune \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/ArchiveTune.app"
          test -x "$APP/ArchiveTune" || { echo "::error::the app target produced no executable at $APP"; exit 1; }
          # Every source of the target must produce its object, including both Swift host files. The lookups below
          # use command substitution and a symbol file instead of feeding a pipeline: under pipefail an early-exiting
          # grep -q can kill the producer with SIGPIPE and fail a check that in fact passed.
          for unit in ArchiveTuneApp ArchiveTuneSession ATNativeAudio ATAudioGraph ATNativeTelegram; do
            found="$(find "$DERIVED_DATA/Build/Intermediates.noindex" -name "$unit.o" -print -quit)"
            [ -n "$found" ] || { echo "::error::$unit did not compile in the app target"; exit 1; }
          done
          # ArchiveTuneShared is a static framework (shared-ui/build.gradle.kts sets isStatic), so its Kotlin objects
          # have to be inside this executable - Swift cannot supply IosHost or IosSafeArea. An embedded copy proves
          # nothing, and a Kotlin symbol in the binary can only come from that link.
          SYMBOLS="$RUNNER_TEMP/natune-app-symbols.txt"
          xcrun nm -g "$APP/ArchiveTune" > "$SYMBOLS"
          grep -qE '_OBJC_CLASS_\$_(IosHost|IosSafeArea)|kfun:moe\.rukamori\.archivetune' "$SYMBOLS" \
            || { echo "::error::no ArchiveTuneShared symbol reached the linked app"; exit 1; }
          # One defined text entry point per bridge proves each reached the link, not only the compiler.
          for symbol in at_audio_create at_graph_create at_telegram_client_create; do
            grep -q "[[:space:]]T _${symbol}\$" "$SYMBOLS" \
              || { echo "::error::$symbol is missing from the linked app"; exit 1; }
          done
