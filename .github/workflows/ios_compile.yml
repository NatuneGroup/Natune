name: iOS compile

# Compiles the shared modules for the iOS simulator on a macOS runner. Linux skips these tasks because Apple
# cinterop needs the Xcode toolchain, so this is the only compile signal for iosMain. Runs only when iOS-facing
# sources change, to keep macOS minutes bounded.
on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'shared-ui/src/iosMain/**'
      - 'shared-data/src/iosMain/**'
      - 'shared-domain/src/iosMain/**'
      - 'shared-*/src/commonMain/**'
      - 'shared-*/src/appleMain/**'
      - 'shared-*/src/nativeMain/**'
      - 'shared-*/build.gradle.kts'
      - 'shared-data/src/nativeInterop/**'
      - 'iosApp/Native/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios_compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile shared modules for the iOS simulator
        run: ./gradlew :shared-ui:compileKotlinIosSimulatorArm64 --continue --stacktrace
