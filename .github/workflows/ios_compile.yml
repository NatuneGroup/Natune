name: iOS compile

# Compiles the shared modules for the iOS simulator on a macOS runner. Linux skips these tasks because Apple
# cinterop needs the Xcode toolchain, so this is the only compile signal for iosMain. It then links the static
# simulator framework and type-checks the Swift app against it on an Xcode 26 SDK, which the iOS 26 glass and
# lyric views need. Runs only when iOS-facing sources change, to keep macOS minutes bounded.
on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'shared-ui/src/iosMain/**'
      - 'shared-data/src/iosMain/**'
      - 'shared-domain/src/iosMain/**'
      - 'shared-*/src/commonMain/**'
      - 'shared-*/src/appleMain/**'
      - 'shared-*/src/nativeMain/**'
      - 'shared-*/build.gradle.kts'
      - 'shared-data/src/nativeInterop/**'
      - 'iosApp/Native/**'
      - 'iosApp/ArchiveTune/**'
      - 'iosApp/ArchiveTune.xcodeproj/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios_compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    # GitHub-hosted arm64 macOS 26 image: free on the public repo and ships Xcode 26.x
    # (the Select step below pins /Applications/Xcode_26.4.app for the iOS 26 SDK APIs).
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The job compiles only Kotlin/Native iOS targets; it never needs the Android SDK.
      # Blank values count as unset, so settings.gradle.kts takes its no-SDK path: :app,
      # :jiosaavn and :morideobfuscator load no build script and the shared modules skip
      # their Android targets. Without this, configuring :app makes AGP auto-install the
      # pinned ~1 GB NDK on every run — a slow dl.google.com transfer whose corrupt
      # downloads have failed this job, and one the iOS tasks never use.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      # The Liquid Glass and TextRenderer APIs exist only in the iOS 26 SDK. Keep the runner's Xcode when it is
      # already the 26.4 the native closure expects; otherwise pick 26.4 or the newest installed Xcode 26.
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          current="$(xcodebuild -version 2>/dev/null | awk 'NR == 1 { print $2 }' || true)"
          if [[ "$current" != "26.4" ]]; then
            candidate=""
            for preferred in /Applications/Xcode_26.4.app /Applications/Xcode_26.4.0.app; do
              if [[ -d "$preferred" ]]; then candidate="$preferred"; break; fi
            done
            if [[ -z "$candidate" ]]; then
              candidate="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            if [[ -z "$candidate" ]]; then
              echo "::error::No Xcode 26 is installed on this runner; the selected Xcode is ${current:-none}."
              exit 1
            fi
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Kotlin/Native compiler and dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile shared modules for the iOS simulator
        run: ./gradlew :shared-ui:compileKotlinIosSimulatorArm64 --continue --stacktrace

      # A static framework needs no native closure, so the Swift sources can be checked without the full app link.
      - name: Link the simulator framework
        run: ./gradlew :shared-ui:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Type-check the Swift app against the framework
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORKS="shared-ui/build/bin/iosSimulatorArm64/debugFramework"
          test -d "$FRAMEWORKS/ArchiveTuneShared.framework"
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -swift-version 5 \
            -target arm64-apple-ios16.0-simulator \
            -F "$FRAMEWORKS" \
            iosApp/ArchiveTune/*.swift
