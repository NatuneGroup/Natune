# Staged private adaptation of the inherited issue triage labels workflow. Inert here: GitHub runs only files directly in
# .github/workflows/, and this copy moves there only after the import-gate disposition and the final CI
# authorization. Manual or reusable-call only: no push, pull request, schedule or issue trigger. Results are
# not verification until the final candidate run completes.
name: Issue triage labels

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character private dev commit whose label definitions and triage script are applied (must equal the checked-out head)
        type: string
        required: true

permissions:
  contents: read
  issues: write

jobs:
  labels:
    if: github.repository == 'NatuneGroup/ArchiveTune-KMP'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate head
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate_sha must be a full 40-character commit SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/github-script@v8
        with:
          script: |
            const definitions = require('./.github/labels.json');
            const { labelsForIssue } = require('./.github/scripts/issue-labels.cjs');
            const { owner, repo } = context.repo;
            for (const label of definitions) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } catch (created) {
                  if (created.status !== 422) throw created;
                  // Another issue event may have created the same missing label.
                  await github.rest.issues.getLabel({ owner, repo, name: label.name });
                }
              }
            }
            if (context.payload.issue) {
              const labels = labelsForIssue(context.payload.issue, context.payload.action);
              if (labels.length) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: context.payload.issue.number, labels,
                });
              }
            }
