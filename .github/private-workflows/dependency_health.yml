# Staged private adaptation of the inherited dependency and semantic health workflow. Inert here: GitHub runs only files directly in
# .github/workflows/, and this copy moves there only after the import-gate disposition and the final CI
# authorization. Manual or reusable-call only: no push, pull request, schedule or issue trigger. Results are
# not verification until the final candidate run completes.
name: Dependency and semantic health

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full commit to check out (defaults to the dispatched or calling head)
        type: string
        required: false
        default: ''
      semantic_base:
        description: Integration revision compared with HEAD; its merge-base with HEAD is used
        required: false
        default: origin/dev
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Optional full commit to check out (defaults to the dispatched or calling head)
        type: string
        required: false
        default: ''
      semantic_base:
        description: Integration revision compared with HEAD; its merge-base with HEAD is used
        required: false
        default: origin/dev
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Compiler-backed dependency and dead-code analysis
    if: github.repository == 'NatuneGroup/ArchiveTune-KMP'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Resolve actual compiler inputs and unused dependency advice
        run: |
          ./gradlew --console=plain --stacktrace --profile \
            -I quality/dependency-analysis.init.gradle qualityInputs :app:projectHealth
      - name: Compare semantic findings against the integration base
        env:
          # Manual and reusable runs compare with the integration branch, so commits made earlier on this
          # branch are not treated as inherited debt. Scheduled default-branch runs keep the parent commit.
          SEMANTIC_BASE: "${{ inputs.semantic_base || (github.event_name == 'schedule' && 'HEAD~1') || 'origin/dev' }}"
        run: |
          set -euo pipefail
          base=$(git rev-parse --verify --end-of-options "${SEMANTIC_BASE}^{commit}")
          if [ "$(git merge-base "$base" HEAD)" = "$(git rev-parse HEAD)" ]; then
            echo "::error::HEAD is not after the semantic base ${SEMANTIC_BASE}; pass an earlier semantic_base" >&2
            exit 1
          fi
          echo "Semantic base commit: ${base} (from ${SEMANTIC_BASE})"
          python3 scripts/check_code_quality.py --base "$base" \
            --classpath-file quality/build/analysis-classpath.txt
      - name: Retain findings, artifact weights and local profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/dependencies/
            build/reports/dependency-analysis/
            app/build/reports/dependency-analysis/
            build/reports/profile/
            .factory/reports/code-quality/
          if-no-files-found: error
          retention-days: 14
