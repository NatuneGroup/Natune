# Staged private adaptation of the inherited repository quality workflow. Inert here: GitHub runs only files directly in
# .github/workflows/, and this copy moves there only after the import-gate disposition and the final CI
# authorization. Manual or reusable-call only: no push, pull request, schedule or issue trigger. Results are
# not verification until the final candidate run completes.
name: Repository quality

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character private dev commit to check (must equal the checked-out head)
        type: string
        required: true
      base:
        description: Integration branch or revision compared with HEAD; its merge-base with HEAD is used
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Lightweight repository contracts
    if: github.repository == 'NatuneGroup/ArchiveTune-KMP'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve integration base
        env:
          BASE_REF: ${{ inputs.base || 'dev' }}
        run: |
          set -euo pipefail
          if base=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}"); then
            true
          else
            git fetch --no-tags -- origin "${BASE_REF}" >&2
            base=$(git rev-parse --verify --end-of-options "origin/${BASE_REF}^{commit}") ||
              base=$(git rev-parse --verify --end-of-options "FETCH_HEAD^{commit}")
          fi
          merge_base=$(git merge-base "$base" HEAD)
          if [ "$merge_base" = "$(git rev-parse HEAD)" ]; then
            echo "::error::Integration base ${BASE_REF} is not after HEAD; pass an earlier base (for dev runs use the last validated revision)" >&2
            exit 1
          fi
          echo "Integration base commit: $merge_base (from ${BASE_REF})"
          echo "BASE_SHA=$merge_base" >> "$GITHUB_ENV"
      - name: Validate check behavior
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test .github/scripts/issue-labels.test.cjs
      - name: Validate candidate contracts
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
        run: |
          python3 scripts/check_repository.py --base "$BASE_SHA"

  kotlin-analysis:
    name: Kotlin quality regressions
    if: github.repository == 'NatuneGroup/ArchiveTune-KMP'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Resolve integration base
        env:
          BASE_REF: ${{ inputs.base || 'dev' }}
        run: |
          set -euo pipefail
          if base=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}"); then
            true
          else
            git fetch --no-tags -- origin "${BASE_REF}" >&2
            base=$(git rev-parse --verify --end-of-options "origin/${BASE_REF}^{commit}") ||
              base=$(git rev-parse --verify --end-of-options "FETCH_HEAD^{commit}")
          fi
          merge_base=$(git merge-base "$base" HEAD)
          if [ "$merge_base" = "$(git rev-parse HEAD)" ]; then
            echo "::error::Integration base ${BASE_REF} is not after HEAD; pass an earlier base (for dev runs use the last validated revision)" >&2
            exit 1
          fi
          echo "Integration base commit: $merge_base (from ${BASE_REF})"
          echo "BASE_SHA=$merge_base" >> "$GITHUB_ENV"
      - name: Check formatting, structural complexity and duplication
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
        run: python3 scripts/check_code_quality.py --base "$BASE_SHA"
      - name: Retain full findings and metrics, including inherited debt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .factory/reports/code-quality/
          if-no-files-found: error
          retention-days: 14
