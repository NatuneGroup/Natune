# Staged private adaptation of the inherited build_pull_request.yml. Inert here: GitHub runs only files
# directly in .github/workflows/, and this copy moves there only after the import-gate disposition and
# the final CI authorization. It replaces the public pull_request trigger with a manual dispatch on one
# exact private dev commit, so pushes and pull requests never start a build matrix. Debug assembly and
# lint are build evidence only; they are not release, signing, upgrade or device evidence.
name: Build Pull Request

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character private dev commit to build (must equal the checked-out head)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # One candidate build per commit. A second dispatch waits instead of cancelling the first.
  group: build-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and lint mobile universal debug APK
    if: github.repository == 'NatuneGroup/Natune'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact candidate head
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate_sha must be a full 40-character commit SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace --profile assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --max-workers=1 --no-daemon --warning-mode summary 2>&1 | python3 -u -c '
          import re
          import sys
          warning = re.compile(r"^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement$")
          for line in sys.stdin:
              if not warning.match(line.rstrip()):
                  sys.stdout.write(line)
          '
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # Public ArchivePool base URL for BuildConfig. Precedence: Actions variable, then the
          # historical secret name, then the Gradle default. Values are never printed.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-universal-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload local build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/profile/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7
