# ICU4J is the desktop/JVM counterpart of android.icu.text.Transliterator for the generic
# "Any-Latin; Latin-ASCII" pass. Unicode-3.0 license; 79.1 is the current release on the mirror.
icu4j = "79.1"
# NewPipeExtractor's release tag; v0.26.5 (2026-08-15) is the latest upstream
# release. Kept because `newpipe-extractor` below still points at it — :core
# has used either fork at different times.
extractor = "0.26.5"

# MetrolistExtractor needs its own version: it is a different artifact from
# NewPipeExtractor and MetrolistGroup publishes no release numbered 0.26.5, so
# sharing `extractor` is what broke CI with "Could not find
# com.github.MetrolistGroup:MetrolistExtractor:0.26.5" the moment the :core
# submodule switched back to `libs.metrolist.extractor`.
#
# Pinned to MetrolistGroup's commit `08a64867704c` (2026-05-29) — the last
# commit before MetrolistExtractor bumped its java toolchain to JDK 25 in
# `1cce4d0ce1bb` (2026-05-29). The :core submodule is a pure Kotlin/JVM module
# with `jvmToolchain(21)` and the CI runner uses JDK 21, so we cannot consume
# artifacts built with `languageVersion = JavaLanguageVersion.of(25)` — Gradle's
# strict variant matching rejects them with "only compatible with JVM runtime
# version 25 or newer". This commit targets Java 8 bytecode (`jvm.version=8` in
# the Gradle module metadata), which is loadable on JVM 21.
#
# The API surface :core relies on (Downloader.executeAsync + AsyncCallback
# nested interface, CancellableCall, 6-arg Response constructor) is already
# present at this commit, so the swap from NewPipeExtractor still works.
#
# MetrolistExtractor is a maintained fork of NewPipeExtractor that keeps the
# `org.schabi.newpipe.extractor` package names. The project publishes only via
# JitPack (no Maven Central release) and has no git tags — JitPack resolves the
# short commit hash. To move to a newer commit, the CI JDK and :core's
# `jvmToolchain(...)` both need to be bumped to ≥ 25.
#
# The MetrolistGroup/MetrolistExtractor repository is no longer publicly
# accessible (observed 2026-11); the pinned commit still resolves through
# JitPack's build cache, and there is no newer consumable release while the
# toolchain constraint above stands. The app and desktop NewPipe tiers declare
# `libs.metrolist.extractor` directly so they can drive the extractor beside
# :core's copy.
metrolistExtractor = "08a64867704c"
graphicsShapes = "1.0.1"
quickjsKt = "1.0.10"

# InnerTubeX — MetrolistGroup's Kotlin Multiplatform InnerTube client, the first extractor tier
# behind the shipped YouTube resolver (playback/stream/YouTubeFailsafeChain). Published on JitPack
# only; v0.11.2 is tag c863ddf15be01a1abfa4630329bdc0a1e95f1531 (GPL-3.0 unchanged), released
# 2026-10-22.
#   - Built with Kotlin 2.4.21, the same release our toolchain compiles with.
#   - Its player cipher is the pure-Kotlin QuackJS 0.1.2 library (com.github.MetrolistGroup.quackjs,
#     GPL-3.0), so the artifact no longer requests a QuickJS native engine the way v0.9.2 did.
#   - The AAR declares minSdk 23 and its classes are Java 21 bytecode; :app is compileSdk 37 /
#     minSdk 24 on AGP 9.2.1 with jvmTarget 21.
# Ktor 3.6.0, kotlinx-serialization 1.12.0 and coroutines 1.11.0 requests; final aligned
# resolution remains a remote gate. See docs/extraction.md for scope.
innertubexVersion = "v0.11.2"
# The desktop host's and the iOS targets' InnerTubeX artifacts (innertubex-desktop,
# innertubex-iosarm64, innertubex-iossimulatorarm64) are per-target modules of the same release.
# The key stays separate only so a host can diverge again if a regression ever forces a split;
# today every module runs the same v0.11.2 and there is no cross-module drift.
innertubexDesktopVersion = "v0.11.2"
# The desktop host alone is on v0.11.5 (tag at 0.11.5): WEB_REMIX-first selection with the library's own
# ClientHealthTracker cooldowns, TVHTML5_SAMSUNG, late SABR tokens, and the fixes that stop a DRM format
# from being handed out when cookies are present. Android and iOS keep v0.11.2 on purpose: their playback
# path did not move with it.
innertubexDesktopAppVersion = "v0.11.5"
# The pattern-based signature/`n` interpreter InnerTubeX compiles against. Natune never calls it directly;
# it is declared so the desktop host's copy is the 0.1.4 build that v0.11.5 is written for.
quackjsVersion = "0.1.4"
bouncyCastle = "1.85"
translator = "1.1.1"
rhino = "1.9.1"
markwon = "4.6.2"
okhttp = "5.4.0"
accompanist = "2.0.0-rc.2"
accompanist-core = "0.5.0"
androidsvg = "1.4"
aboutLibraries = "15.0.3"
liquid-glass = "2.0.1"
# Haze library — used by the queue's frosted-glass blur behind the player artwork.
# Ported from vivi-music (beta) which uses these exact parameters:
# blurRadius = 80.dp, tint = HazeTint(Color.Black.copy(alpha = 0.30f)), noiseFactor = 0.15f.
# Haze handles the RenderEffect plumbing on API 31+ internally and falls back to
# a software blur on older devices, so we no longer need the API 31+ gate that
# the previous Compose BlurEffect approach required.
haze = "1.7.2"
# androidx.car.app — CarConnection, which the Android Auto settings screen uses to tell whether
# the app is projected through Android Auto or running natively on Android Automotive.
carApp = "1.7.0"
# dbus-java — pure-Java D-Bus client (MIT) the desktop's Linux MPRIS and StatusNotifierItem exports
# run on. The native-unixsocket transport talks to the session bus without JNI.
dbusJava = "5.1.1"


